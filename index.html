<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Apex</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apex">
<meta name="theme-color" content="#070913">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* A10: Nunito is served from Apex itself (Latin only, weights 600 to 900, 54 KB, SIL Open Font License in fonts/), so no request goes to Google.
   On iPhone the system rounded font is used first anyway; this is mainly for Android friends. */
@font-face{font-family:'Nunito';src:url('fonts/nunito-latin.woff?v=1') format('woff');font-weight:600 900;font-style:normal;font-display:swap}
/* Layout idea: one phone-width column of glass panels floating over a slow colour field; a floating glass tab bar; sheets rise from the bottom. Single dark theme by choice. */
:root{
  color-scheme:dark;
  --bg:oklch(14.3% 0.022 273.5);
  --ink:oklch(97.6% 0.007 268.5);
  /* secondary text is set so it stays above 4.5:1 on the brightest part of the colour field behind a card */
  --ink-2:oklch(97.6% 0.007 268.5 / .8);
  --ink-3:oklch(97.6% 0.007 268.5 / .72);
  --glass:rgb(255 255 255 / .075);
  --glass-strong:rgb(255 255 255 / .13);
  --edge:rgb(255 255 255 / .2);
  --warm:oklch(72.9% 0.170 35.1);
  --cool:oklch(62.3% 0.210 283);
  --good:oklch(82.5% 0.150 158.6);
  --gold:oklch(88% 0.135 86.1);
  --bad:oklch(71.2% 0.181 22.8);
  --blue:oklch(76.3% 0.122 257.1);
  /* glass panels sit on a dark tint so text on them stays readable over the bright parts of the field */
  --tint:rgb(10 12 28 / .48);
  /* nested corners: inner radius = outer radius - padding (cards 30 - 18 = 12, sheets 36 - 18 = 18) */
  --ir:18px;
  --display:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --r:30px;
  interpolate-size:allow-keywords;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--sab:min(env(safe-area-inset-bottom,0px),34px)}html,body{height:100%;margin:0}html{height:calc(100% + var(--vgap,0px))}body{position:relative}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
p{text-wrap:pretty}
body{font-variant-numeric:tabular-nums}
.theme-switching *,.theme-switching *::before,.theme-switching *::after{transition:none!important}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* colour field */
html{background:#060814}
.field{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;z-index:0;pointer-events:none;background:#060814}
.field i{position:absolute;inset:-30%;will-change:transform}
/* the drifting background makes every blurred panel above it re-blur each frame, so hold it still while a finger is down or a pop-up is open */
body.still .field i,body:has(#scrim.on) .field i,body:has(#lock.on) .field i{animation-play-state:paused}
.field i:nth-child(1){background:radial-gradient(42% 36% at 28% 24%,rgba(92,74,255,.8),transparent 72%),radial-gradient(40% 36% at 78% 72%,rgba(0,160,215,.55),transparent 72%);animation:driftA 19s ease-in-out infinite alternate}
.field i:nth-child(2){background:radial-gradient(34% 30% at 76% 24%,rgba(255,112,92,.38),transparent 72%),radial-gradient(44% 38% at 18% 82%,rgba(150,84,255,.5),transparent 72%);animation:driftB 25s ease-in-out infinite alternate}
.field i:nth-child(3){inset:0;background:radial-gradient(130% 90% at 50% 10%,transparent 45%,rgba(3,4,10,.72))}
@keyframes driftA{to{transform:translate(9%,7%) rotate(10deg) scale(1.12)}}
@keyframes driftB{to{transform:translate(-8%,-6%) rotate(-12deg) scale(1.18)}}
@keyframes in{from{opacity:0;transform:scale(.97)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pop{40%{transform:scale(1.25)}}
@keyframes fade{from{opacity:0}}
@keyframes inR{from{opacity:0;transform:translateX(24px) scale(.97)}}
@keyframes inL{from{opacity:0;transform:translateX(-24px) scale(.97)}}
@keyframes out{to{opacity:0;transform:scale(.98)}}
@keyframes outL{to{opacity:0;transform:translateX(-24px) scale(.98)}}
@keyframes outR{to{opacity:0;transform:translateX(24px) scale(.98)}}
.ghost{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;animation:out .16s cubic-bezier(.23,1,.32,1) both}
.ghost.r{animation-name:outL}.ghost.l{animation-name:outR}
/* SOLE exception to the under-300ms screen-change rule (Asher, 22 Nov): a left/right page swipe gets a longer,
   wider slide so it reads as movement rather than a snap. Taps and dock changes keep the quick version. */
@keyframes swR{from{opacity:0;transform:translateX(56px)}}
@keyframes swL{from{opacity:0;transform:translateX(-56px)}}
@keyframes swOutL{to{opacity:0;transform:translateX(-56px)}}
@keyframes swOutR{to{opacity:0;transform:translateX(56px)}}
.ghost.sw{animation-duration:.3s;animation-timing-function:cubic-bezier(.32,.72,0,1)}
.ghost.sw.r{animation-name:swOutL}.ghost.sw.l{animation-name:swOutR}
main.enter>*{animation:in .22s cubic-bezier(.23,1,.32,1) both}
@keyframes ringin{from{stroke-dasharray:0 290}}
@keyframes emblemin{from{opacity:0;transform:scale(.97)}}
main.enter .ring circle+circle{animation:ringin .28s cubic-bezier(.23,1,.32,1) both}
main.enter .emblem{animation:emblemin .22s cubic-bezier(.23,1,.32,1) both;transform-origin:50% 50%}
.tap{transition:transform .3s cubic-bezier(.3,1.7,.5,1)}.tap:active{transform:scale(.975);transition-duration:.08s}
main.enter.r>*{animation-name:inR}main.enter.l>*{animation-name:inL}
main.enter.sw>*{animation-duration:.38s;animation-timing-function:cubic-bezier(.32,.72,0,1)}main.enter.sw.r>*{animation-name:swR}main.enter.sw.l>*{animation-name:swL}
nav{touch-action:none;-webkit-user-select:none;user-select:none}
main.enter>*:nth-child(2){animation-delay:.012s}main.enter>*:nth-child(3){animation-delay:.024s}main.enter>*:nth-child(4){animation-delay:.036s}main.enter>*:nth-child(5){animation-delay:.044s}main.enter>*:nth-child(n+6){animation-delay:.05s}
main.enter>*:nth-child(n+9){animation:none}
main.enter .track i{animation:grow .28s cubic-bezier(.23,1,.32,1) both;transform-origin:left}
.check.pop{animation:pop .42s cubic-bezier(.3,1.4,.5,1)}
#scrim.opening{animation:fade .32s}
#scrim.closing{opacity:0;transition:opacity .28s}
#scrim.closing #sheet{transform:translateY(90px) scale(.9)!important;opacity:0;transition:transform .28s cubic-bezier(.32,.72,0,1),opacity .24s cubic-bezier(.23,1,.32,1)!important}
@media (prefers-reduced-motion:reduce){.ghost,.field i,main.enter>*,main.enter .track i,.check.pop,#scrim.on,#sheet{animation:none!important}*{transition:none!important}}

/* display and accessibility switches (Settings, General). Stored per device. */
html{-webkit-text-size-adjust:var(--tsa,100%);text-size-adjust:var(--tsa,100%);touch-action:manipulation}
html.calm .ghost,html.calm .field i,html.calm main.enter>*,html.calm main.enter .track i,html.calm main.enter .ring circle+circle,html.calm main.enter .emblem,html.calm .check.pop,html.calm #scrim.on,html.calm #sheet{animation:none!important}html.calm *{transition:none!important}
html.lite .field i{animation:none!important}
html.lite #nav,html.lite #rest,html.lite #toast,html.lite #sheet,html.lite #launch{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:#171b30!important}
html.hc{--ink-2:rgba(245,247,252,.9);--ink-3:rgba(245,247,252,.78);--edge:rgba(255,255,255,.55)}
html.hc .field i{opacity:.35}
html.hc .card,html.hc .tile{background:#141829!important;border:1px solid rgba(255,255,255,.5)!important}
html.hc #nav,html.hc #sheet,html.hc #launch,html.hc #rest,html.hc #toast{background:#10142a!important;border:1px solid rgba(255,255,255,.6)!important}
html.hc .info{color:var(--ink)}
html.nohap .hx{display:none!important}

/* shell */
#app{position:relative;z-index:1;height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
main{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 26px) max(18px,env(safe-area-inset-right)) calc(var(--sab) + 132px) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding:0 6px 4px;flex-wrap:wrap}
.top h1{font-size:32px;font-weight:900;letter-spacing:-.4px;line-height:1.1}
.top .sub{color:var(--ink-2);font-size:14px;margin-bottom:2px}

/* glass */
.glass{position:relative;background:linear-gradient(160deg,var(--glass-strong),var(--glass) 45%,rgb(255 255 255 / .04)),var(--tint);
  border:1px solid var(--edge);border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 22px rgba(255,255,255,.04),0 14px 34px rgba(0,0,0,.32)}
.card{padding:18px;--ir:12px}
.card h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2+*{margin-top:14px}
.muted{color:var(--ink-2)}.small{font-size:13px}
.info{color:var(--ink-3);font-size:12px;text-decoration:underline;text-underline-offset:3px;font-family:var(--body);font-weight:400;padding:14px 6px;margin:-14px -6px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{padding:14px;border-radius:var(--ir);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.tile b{display:block;font-family:var(--display);font-size:22px;line-height:1.2;margin-bottom:2px;font-weight:900;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--ink-2)}

#nav,#rest,#toast{-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.card{background:linear-gradient(160deg,rgb(255 255 255 / .12),rgb(255 255 255 / .06) 45%,rgb(255 255 255 / .03)),var(--tint);contain:layout paint}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#nav,#rest,#toast,#sheet,#launch{background:oklch(22% 0.03 275)!important}}
.tap{cursor:pointer}
.setbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:20px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.setbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:16px;font-size:10.5px;font-weight:600;color:var(--ink-2);transition:background .25s,color .25s}
.setbar button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.setbar button.on{background:rgba(255,255,255,.18);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.phstrip{display:flex;gap:10px;overflow-x:auto;touch-action:pan-x;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.ph{flex:none;width:96px;display:flex;flex-direction:column;gap:6px;align-items:center}
.ph img{width:96px;height:128px;object-fit:cover;border-radius:var(--ir);background:rgba(255,255,255,.08);display:block}
.phfull{width:100%;border-radius:var(--ir);display:block;background:rgba(255,255,255,.06);min-height:120px}
.fold{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s cubic-bezier(.22,1,.32,1),opacity .4s}
.hist.open .fold{grid-template-rows:1fr;opacity:1}
.foldin{overflow:hidden;min-height:0}
.foldin>*:first-child{margin-top:14px}
.ladder{display:flex;flex-wrap:wrap;gap:8px}
.ladder span{padding:6px 10px;border-radius:12px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.14);color:var(--ink-3);font-variant-numeric:tabular-nums}
.ladder span.got{background:rgba(255,255,255,.1)}
input[type=password]{width:100%;height:46px;padding:0 14px;border-radius:var(--ir);background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);font-size:16px;box-sizing:border-box}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:700;
  background:rgba(255,255,255,.1);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:transform .12s,background .12s}
.btn{transition:transform .32s cubic-bezier(.3,1.8,.5,1),background .12s}
.btn:active{transform:scale(.93);transition-duration:.08s}
.btn.primary{background:linear-gradient(180deg in oklch,#fff,#dfe5f5);color:#0b0d18;border-color:rgb(255 255 255 / .9);box-shadow:0 8px 24px rgba(255,255,255,.18)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:44px;padding:0 16px;font-size:14px;white-space:nowrap}
.btn.block{width:100%}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.seg{display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1)}
.seg button{min-height:44px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:rgba(255,255,255,.2);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;background:rgb(255 255 255 / .08);background-clip:padding-box;border:7px solid transparent;border-left-width:0;border-right-width:0;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .12);white-space:nowrap}
.chip.on{background:#fff;color:#0b0d18}
.pr{white-space:nowrap;flex:none;display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.4px;background:var(--gold);color:#3a2a00}
input[type=text],input[type=number],input[type=date],select{width:100%;min-height:46px;padding:0 14px;border-radius:var(--ir);background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);font-size:16px}
input::placeholder{color:var(--ink-3)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);min-width:0}
input[type=text],input[type=number],input[type=date],select{height:46px;box-sizing:border-box}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block;text-align:left;line-height:44px;padding-top:0;padding-bottom:0}
input::-webkit-date-and-time-value{margin:0;min-height:0}
input::-webkit-date-and-time-value{text-align:left}

/* tab bar */
#nav{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 14px);width:min(508px,calc(100% - 32px));display:flex;padding:6px;border-radius:999px}
nav .di{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:999px;font-size:11px;font-weight:600;color:var(--ink-2)}
nav .di svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .di{cursor:pointer;position:relative;z-index:1;transition:color .25s,transform .12s}nav .di:active{transform:scale(.92)}
nav .di.on{color:var(--ink)}
nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/var(--n,5));border-radius:999px;background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 14px rgba(0,0,0,.2);transition:transform .28s cubic-bezier(.23,1,.32,1),opacity .2s cubic-bezier(.23,1,.32,1)}
nav .grab{position:absolute;top:-38px;left:50%;transform:translateX(-50%);width:72px;height:44px;flex:none;padding:0;z-index:2}
nav .grab::after{content:'';position:absolute;left:50%;top:28px;width:36px;height:4px;margin-left:-18px;border-radius:9px;background:rgba(255,255,255,.38)}
nav .grab:active{transform:translateX(-50%)}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 0}
#lscrim{position:absolute;inset:0;z-index:7;display:none;opacity:0;background:rgba(3,4,10,.5)}
#launch{position:absolute;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 14px);width:min(508px,calc(100% - 32px));display:none;overflow:hidden;touch-action:none;
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
/* closed, the launcher is drawn exactly like the dock; its own tint sits on a layer that fades with how far it is open, so the hand-over between the two cannot be seen */
#launch::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(170deg,rgba(255,255,255,.14),rgba(120,130,190,.12) 40%,rgba(14,17,36,.62));opacity:var(--lp,1);transition:opacity var(--lt,0s)}
#linner{position:relative;padding:10px 18px 20px;overflow-y:auto;transform-origin:50% 100%;box-sizing:border-box}
html #nav.lghost{z-index:9;pointer-events:none;background:transparent!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#linner h2{font-size:22px;font-weight:900}
#dockrow{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;margin-top:14px;padding:8px;border-radius:22px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);touch-action:none;user-select:none;-webkit-user-select:none}
.dslot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border-radius:16px;background:rgba(255,255,255,.1);font-size:11px;font-weight:700;transition:transform .22s cubic-bezier(.2,.9,.2,1);cursor:grab}
.dslot svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.dslot span{pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dslot.drag{transition:none;background:rgba(255,255,255,.26);z-index:2;position:relative;box-shadow:0 10px 24px rgba(0,0,0,.4)}
#linner p{margin:8px 0 0}
#linner .pgrp{border-radius:var(--ir,12px);background:rgb(255 255 255 / .04);margin-bottom:8px;overflow:hidden}
.pgh{width:100%;min-height:48px;padding:0 14px;text-align:left}
.pgh .chev{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;color:var(--ink-3);transition:transform .2s cubic-bezier(.23,1,.32,1)}
.pgrp.open .chev{transform:rotate(180deg)}
.pgb{display:none;padding:0 6px 6px}.pgrp.open .pgb{display:block}
.pgb>button{min-height:44px;padding:0 8px;border-radius:10px}
.grabline{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.32);margin:0 auto 14px}
.ltile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px 14px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:600;transition:transform .15s,background .3s,border-color .3s}
.ltile{transition:transform .32s cubic-bezier(.3,1.8,.5,1),background .3s,border-color .3s}
.ltile:active{transform:scale(.9);transition-duration:.08s}
.ltile svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ltile em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3)}
.ltile.soon{color:var(--ink-3)}
.ltile.pinned{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5)}.ltile.pinned em{color:var(--good)}

/* rest pill */
#rest{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 86px);width:min(508px,calc(100% - 32px));padding:10px 12px 10px 18px;border-radius:999px;display:none;align-items:center;gap:10px;overflow:hidden}
#rest.on{display:flex}
#rest .bar{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;background:linear-gradient(90deg in oklch,oklch(62.3% 0.21 283 / .45),oklch(72.9% 0.17 35.1 / .45));z-index:-1;transition:transform 1s linear}
#rest .t{font-family:var(--display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;min-width:64px}
/* narrow phones (many Androids are 360 px wide): drop the word "Rest" and slim the buttons so Skip fits */
@media (max-width:389px){#rest{gap:6px;padding:8px 8px 8px 14px}#rest>.small{display:none}#rest .btn.sm{padding-left:12px;padding-right:12px;min-width:52px}}

['pallof','Pallof Press','Core'],['woodchop','Cable Woodchopper','Core'],['adduct','Hip Adduction','Other'],['farmer','Farmer\'s Carry','Other'],['wristcurl','Wrist Curl','Other'],['revwrist','Reverse Wrist Curl','Other'],['powerclean','Power Clean','Other'],['cleanpress','Clean and Press','Other']
].map(a=>({id:a[0],name:a[1],muscle:a[2],bw:!!a[3]}));
const TIERS=[['Iron','#9aa3ad'],['Bronze','#d1915f'],['Silver','#d5dbe3'],['Gold','#ffd166'],['Platinum','#7fe6d3'],['Diamond','#8cc7ff'],['Titan','#c9a0ff']];
/* estimated 1RM as a multiple of bodyweight needed to reach Bronze … Titan (male) */
const STD={bench:[.5,.75,1,1.25,1.5,1.9],squat:[.75,1,1.35,1.75,2.1,2.6],dead:[1,1.25,1.6,2,2.5,3],ohp:[.35,.5,.65,.8,1,1.25],row:[.5,.7,.9,1.1,1.35,1.6],pullup:[1,1.1,1.25,1.45,1.7,2]};
const FEM={bench:.6,squat:.75,dead:.75,ohp:.62,row:.65};
const LB=2.20462, DAY=864e5, VERSION='0.81';

let S={settings:{unit:'kg',sex:'male',rest:120},custom:[],routines:[],weights:[],workouts:[],active:null,food:{},foods:[]};
let tab='home', expanded=null, pickFilter='All', pickQuery='', confirmCb=null, rest=null, DEMO=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uidGen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const unit=()=>S.settings.unit;
const disp=kg=>kg==null||kg===''?'':String(Math.round((unit()==='lb'?kg*LB:kg)*10)/10);
const toKg=v=>unit()==='lb'?v/LB:v;
const big=kg=>{const v=unit()==='lb'?kg*LB:kg;return v>=10000?(Math.round(v/100)/10)+'k':String(Math.round(v))};
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const monthKey=t=>'wk_'+ymd(t).slice(0,7);
const niceDate=t=>new Date(t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const dur=ms=>{const m=Math.max(0,Math.round(ms/6e4));return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m'};
const exById=id=>LIB.find(e=>e.id===id)||S.custom.find(e=>e.id===id)||{id,name:'Unknown exercise',muscle:'Other'};
const allEx=()=>LIB.concat(S.custom);
const isEmpty=()=>!S.workouts.length&&!S.weights.length&&!S.active;
const V=()=>isEmpty()?DEMO:S;           /* what the screens read: real data, or marked examples */
const bwNow=()=>{const w=V().weights;return w.length?w[w.length-1].kg:0};
/* A17: rep-based 1RM formulas drift 15-20% above about 10 reps, so a set of more than 10 reps is
   scored as if it were 10 at that weight. That never overstates strength; higher-rep sets show up as rep PRs instead. */
const E1RM_MAX_REPS=10;
const e1rm=(w,r)=>r<=1?w:w*(1+Math.min(r,E1RM_MAX_REPS)/30);
/* A18: bodyweight lifts add the trend weight on the day of the set, so old PRs don't move when your weight changes. */
let bwAtCache=null;
function bwAt(t){const ws=V().weights;if(!ws.length)return 0;if(t==null)t=Date.now();
  if(!bwAtCache||bwAtCache.src!==ws||bwAtCache.n!==ws.length||bwAtCache.last!==ws[ws.length-1]){const sorted=ws.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0),tr=trend(sorted);bwAtCache={src:ws,n:ws.length,last:ws[ws.length-1],d:sorted.map(x=>x.d),v:tr}}
  const d=ymd(t),c=bwAtCache;let lo=0,hi=c.d.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(c.d[m]<=d){k=m;lo=m+1}else hi=m-1}return c.v[k<0?0:k]}
function score(ex,set,at){const load=(set.w||0)+(ex.bw?bwAt(at):0);return load>0?e1rm(load,set.r||0):(set.r||0)/100}
function bestOf(list,exId){let b=null;const ex=exById(exId);for(const w of list)for(const e of w.exercises)if(e.exId===exId)for(const s of e.sets){const sc=score(ex,s,w.start);if(!b||sc>b.sc)b={sc,w:s.w||0,r:s.r,at:w.start}}return b}
/* PRs per lift, at most one per lift per workout, most important first:
   Est. 1RM, Heaviest, Reps (more reps than ever at that weight or heavier), Best set (weight x reps), Session volume (A19). */
function recomputePRs(list){list.sort((a,b)=>a.start-b.start);const best={};for(const w of list){w.prs=[];for(const e of w.exercises){const ex=exById(e.exId);let sc=0,wt=0,sv=0,tv=0;const reps={};
  for(const s of e.sets){sc=Math.max(sc,score(ex,s,w.start));wt=Math.max(wt,s.w||0);const v=(s.w||0)*(s.r||0);sv=Math.max(sv,v);tv+=v+dropVol(s);const k=+(s.w||0);reps[k]=Math.max(reps[k]||0,s.r||0)}
  const b=best[e.exId];if(b){let rp=null;
    /* a rep PR needs more reps than any earlier set at this weight or heavier */
    for(const k of Object.keys(reps).map(Number).sort((x,y)=>y-x)){const prev=Object.keys(b.reps).map(Number).filter(x=>x>=k-1e-9).reduce((a,x)=>Math.max(a,b.reps[x]),0);if(prev>0&&reps[k]>prev&&reps[k]>=2){rp={kg:k,r:reps[k]};break}}
    if(sc>b.sc+1e-6)w.prs.push({exId:e.exId,type:'Est. 1RM',kg:sc});else if(wt>b.wt+1e-6)w.prs.push({exId:e.exId,type:'Heaviest',kg:wt});
    else if(rp)w.prs.push({exId:e.exId,type:'Reps',kg:rp.kg,r:rp.r});
    else if(sv>b.sv+1e-6&&sv>0)w.prs.push({exId:e.exId,type:'Best set',kg:sv,vol:1});
    else if(tv>b.tv+1e-6&&tv>0&&e.sets.length>1)w.prs.push({exId:e.exId,type:'Session volume',kg:tv,vol:1})}
  const nr=Object.assign({},b?b.reps:{});for(const k in reps)nr[k]=Math.max(nr[k]||0,reps[k]);
  best[e.exId]={sc:Math.max(sc,b?b.sc:0),wt:Math.max(wt,b?b.wt:0),sv:Math.max(sv,b?b.sv:0),tv:Math.max(tv,b?b.tv:0),reps:nr}}}}
/* how a PR's number reads: "82.5 kg", "60 kg × 12" or "2.4k kg" */
const prVal=p=>p.type==='Reps'?(p.kg>0?disp(p.kg)+' '+unit()+' × '+p.r:p.r+' reps'):p.vol?big(p.kg)+' '+unit():disp(p.kg)+' '+unit();
/* a drop set's extra drops (s.dr: [{w,r}]) count towards volume, never towards PRs */
const dropVol=s=>(s.dr||[]).reduce((a,d)=>a+(d.w||0)*(d.r||0),0);
const volume=w=>w.exercises.reduce((a,e)=>a+e.sets.reduce((x,s)=>x+(s.w||0)*(s.r||0)+dropVol(s),0),0);

function buildDemo(){const now=Date.now(),names=['Push','Legs','Pull'],plan=[['bench','ohp','incdb','pushdown'],['squat','rdl','legext','calf'],['dead','pullup','row','curl']],base={bench:72.5,ohp:45,incdb:26,pushdown:27.5,squat:95,rdl:85,legext:55,calf:70,dead:125,pullup:0,row:65,curl:32.5};

/* Everything is kept on this device (localStorage). If config.js holds a Firebase config and you sign in, the same data is mirrored to your own Firestore database under users/<your id>/data. */
const LS='apex.v1',CFG=(window.APEX_CONFIG||{}).firebase||null;
let blockReason='',isOwner=false,vaultKey=null;
const lsGet=k=>{try{return localStorage.getItem(LS+k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(LS+k,v)}catch(e){}},lsDel=k=>{try{localStorage.removeItem(LS+k)}catch(e){}};

/* On-device storage (A1). History is kept in IndexedDB as one record per document, the same documents the cloud uses
   (settings, weights, active, foods, wk_YYYY-MM, fd_YYYY-MM). localSave() only asks for a save: 300 ms later the documents
   whose contents changed are written together in one go, and leaving the app writes straight away. Nothing blocks a tap.
   The first time, the old single localStorage copy is moved across and kept until the next successful start, then removed.
   If IndexedDB cannot be opened at all, the app falls back to that old localStorage copy. */
let dataDB=null,storeMode='ls',lastDoc={},saveT=null;
function lsSaveAll(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('This device is out of storage space. Export a backup.')}}
function lsLoad(){try{const t=localStorage.getItem(LS);if(t){const o=JSON.parse(t);if(o&&Array.isArray(o.workouts))S=Object.assign(S,o)}}catch(e){}if(!S.food)S.food={};if(!S.foods)S.foods=[]}
function dbOpen(){return new Promise(res=>{try{const rq=indexedDB.open('apex-data',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('docs');rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);rq.onblocked=()=>res(null)}catch(e){res(null)}})}
function docKeys(){const ks=new Set(['settings','weights','active','foods']);for(const w of S.workouts)ks.add(monthKey(w.start));for(const d in S.food)ks.add('fd_'+d.slice(0,7));for(const k in lastDoc)ks.add(k);return[...ks]}
/* build S from a set of documents (used for the on-device copy) */
function fromDocs(m){const C={settings:null,custom:[],routines:[],weights:[],workouts:[],active:null,food:{},foods:[]};
  for(const id in m){const v=m[id]||{};if(id==='settings'){C.settings=v.settings;C.custom=v.custom||[];C.routines=v.routines||[]}else if(id==='weights')C.weights=v.list||[];else if(id==='active')C.active=v.w||null;else if(id==='foods')C.foods=v.list||[];else if(id.startsWith('wk_'))C.workouts.push(...(v.list||[]));else if(id.startsWith('fd_'))Object.assign(C.food,v.days||{})}
  C.workouts.sort((a,b)=>a.start-b.start);return C}
function localSave(){if(storeMode!=='idb'){lsSaveAll();return}clearTimeout(saveT);saveT=setTimeout(storeFlush,300)}
function storeFlush(){clearTimeout(saveT);saveT=null;if(storeMode!=='idb'||!dataDB)return Promise.resolve(0);const ch=[];
  for(const k of docKeys()){const j=JSON.stringify(docFor(k));if(lastDoc[k]!==j)ch.push([k,j])}if(!ch.length)return Promise.resolve(0);
  return new Promise(res=>{try{const tx=dataDB.transaction('docs','readwrite'),os=tx.objectStore('docs');for(const [k,j] of ch)os.put(j,k);
    tx.oncomplete=()=>{for(const [k,j] of ch)lastDoc[k]=j;res(ch.length)};tx.onerror=tx.onabort=()=>{toast('Could not save on this device. It may be out of space. Export a backup.');res(-1)}}catch(e){res(-1)}})}
function storeAll(){return new Promise(res=>{try{const out={},rq=dataDB.transaction('docs').objectStore('docs').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>res(null)}catch(e){res(null)}})}
async function storeLoad(){dataDB=await dbOpen();const all=dataDB?await storeAll():null;
  if(!all){storeMode='ls';dataDB=null;lsLoad();return}
  storeMode='idb';const keys=Object.keys(all);
  if(keys.length){const m={};for(const k of keys){try{m[k]=JSON.parse(all[k])}catch(e){}}lastDoc=Object.assign({},all);const C=fromDocs(m);
    S=Object.assign(S,{settings:Object.assign({unit:'kg',sex:'male',rest:120},C.settings||{}),custom:C.custom,routines:C.routines,weights:C.weights,workouts:C.workouts,active:C.active,food:C.food,foods:C.foods});
    /* the old copy was kept for one start after moving across; this start loaded fine, so it can go */
    if(lsGet('.moved')){try{localStorage.removeItem(LS)}catch(e){}lsDel('.moved')}}
  else{lsLoad();if(localStorage.getItem(LS)){const n=await storeFlush();if(n>0)lsSet('.moved',String(Date.now()));else{storeMode='ls'}}}
  if(!S.food)S.food={};if(!S.foods)S.foods=[]}
function localLoad(){lsLoad()}
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')storeFlush()});addEventListener('pagehide',()=>{storeFlush()});
function unsynced(){try{return JSON.parse(localStorage.getItem(LS+'.unsynced')||'[]')}catch(e){return[]}}
function markUnsynced(k,on){try{const s=new Set(unsynced());on?s.add(k):s.delete(k);localStorage.setItem(LS+'.unsynced',JSON.stringify([...s]))}catch(e){}}
const clone=o=>JSON.parse(JSON.stringify(o));
function docFor(key){if(key==='settings')return{settings:S.settings,custom:S.custom,routines:S.routines};if(key==='weights')return{list:S.weights};if(key==='active')return{w:S.active};if(key==='foods')return{list:S.foods};
  if(key.startsWith('fd_')){const days={},m=key.slice(3);for(const d in S.food)if(d.startsWith(m)&&S.food[d].length)days[d]=S.food[d];return{days}}
  return{list:S.workouts.filter(w=>monthKey(w.start)===key)}}
function cloudPut(key){markUnsynced(key,true);if(key.startsWith('wk_')||key.startsWith('fd_'))knownMonths.add(key);if(!cloudReady)return;pend[key]=clone(docFor(key));if(!busy[key])pump(key)}
async function pump(key){busy[key]=true;while(key in pend){const d=pend[key];delete pend[key];try{await fb.F.setDoc(fb.F.doc(fb.db,'users',fbUser.uid,'data',key),Object.assign({},d,{u:fb.F.serverTimestamp()}));if(!(key in pend))markUnsynced(key,false)}catch(e){cloudState='error';toast('Could not sync. Your change is kept on this device and will sync later.')}}busy[key]=false}
let activeTimer=null;
function save(...keys){localSave();for(const k of keys){if(k==='active'){markUnsynced('active',true);clearTimeout(activeTimer);activeTimer=setTimeout(()=>cloudPut('active'),1500)}else cloudPut(k)}}
function saveAll(){localSave();const months=new Set(S.workouts.map(w=>monthKey(w.start)));Object.keys(S.food).forEach(d=>months.add('fd_'+d.slice(0,7)));knownMonths.forEach(m=>months.add(m));['settings','weights','active','foods',...months].forEach(cloudPut)}
const hasLocal=()=>!isEmpty()||S.custom.length>0||S.routines.length>0||Object.keys(S.food).length>0||S.foods.length>0;
async function initCloud(){if(!CFG){cloudState='off';return}
  /* A6: current Firebase (13.4.0). If it cannot be loaded for any reason, the previous version that is known to work is used instead. */
  const load=v=>Promise.all([import('https://www.gstatic.com/firebasejs/'+v+'/firebase-app.js'),import('https://www.gstatic.com/firebasejs/'+v+'/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/'+v+'/firebase-firestore.js')]).then(m=>{window.fbVersion=v;return m});
  try{const [A,U,F]=await load('13.4.0').catch(()=>load('10.12.2'));
    const app=A.initializeApp(CFG);fb={auth:U.getAuth(app),db:F.getFirestore(app),U,F};
    U.onAuthStateChanged(fb.auth,u=>{fbUser=u;cloudReady=false;isOwner=false;vaultKey=null;if(u){vaultLocal(u.uid).then(k=>{if(k&&!vaultKey&&fbUser&&fbUser.uid===u.uid){vaultKey=k;phFlush();refreshSettings()}});pull()}else{cloudState='signedout';refreshSettings();if(tab==='home')render();maybeAskLogin()}})
  }catch(e){cloudState='error';refreshSettings()}}
/* Sync downloads (A3). Every document written to the cloud carries a server time (u). After one full download, the app
   asks only for documents changed since the newest time it has seen, so coming back to the app usually downloads nothing.
   A full download still happens on the first sync on a device, after 24 hours, or if anything looks out of step. */
const pullMark=()=>{try{return JSON.parse(lsGet('.pullMark.'+fbUser.uid)||'null')}catch(e){return null}},pullMarkSet=o=>lsSet('.pullMark.'+fbUser.uid,JSON.stringify(o));
const uMs=v=>{try{return v&&v.u&&typeof v.u.toMillis==='function'?v.u.toMillis():0}catch(e){return 0}};
function applyDoc(id,v){const dirty=new Set(unsynced()).has(id);
  if(id==='settings'){if(dirty){const cs=new Set(S.custom.map(c=>c.id));for(const c of(v.custom||[]))if(!cs.has(c.id))S.custom.push(c);const rs=new Set(S.routines.map(c=>c.id));for(const c of(v.routines||[]))if(!rs.has(c.id))S.routines.push(c)}else{S.settings=Object.assign({unit:'kg',sex:'male',rest:120},v.settings||{});S.custom=v.custom||[];S.routines=v.routines||[]}}
  else if(id==='weights'){if(dirty){const days=new Set(S.weights.map(w=>w.d));for(const w of(v.list||[]))if(!days.has(w.d))S.weights.push(w);S.weights.sort((a,b)=>a.d<b.d?-1:1)}else S.weights=v.list||[]}
  else if(id==='active'){if(!dirty)S.active=v.w||null}
  else if(id==='foods'){if(dirty){const have=new Set(S.foods.map(f=>f.n+'|'+(f.b||'')));for(const f of(v.list||[]))if(!have.has(f.n+'|'+(f.b||'')))S.foods.push(f)}else S.foods=v.list||[]}
  else if(id.startsWith('wk_')){knownMonths.add(id);if(dirty){const ids=new Set(S.workouts.map(w=>w.id));for(const w of(v.list||[]))if(!ids.has(w.id))S.workouts.push(w)}else S.workouts=S.workouts.filter(w=>monthKey(w.start)!==id).concat(v.list||[]);S.workouts.sort((a,b)=>a.start-b.start)}
  else if(id.startsWith('fd_')){knownMonths.add(id);const m=id.slice(3),days=v.days||{};if(dirty){for(const d in days){const mine=S.food[d]||(S.food[d]=[]),have=new Set(mine.map(e=>e.id));for(const e of days[d])if(!have.has(e.id))mine.push(e)}}else{for(const d of Object.keys(S.food))if(d.startsWith(m))delete S.food[d];Object.assign(S.food,days)}}
  if(dirty)cloudPut(id)}
async function pullChanges(mark){const snap=await fb.F.getDocs(fb.F.query(fb.F.collection(fb.db,'users',fbUser.uid,'data'),fb.F.where('u','>',fb.F.Timestamp.fromMillis(Math.max(0,mark.u-2000)))));
  let max=mark.u,n=0,wk=false;snap.forEach(d=>{const v=d.data()||{};n++;max=Math.max(max,uMs(v));if(d.id.startsWith('wk_'))wk=true;applyDoc(d.id,v)});
  if(n){if(wk)recomputePRs(S.workouts);localSave();const typing=document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);if(!typing)render()}
  pullMarkSet({u:max,full:mark.full});return n}
async function pull(){if(!fb||!fbUser||pulling)return;if(Object.keys(pend).length||Object.values(busy).some(Boolean))return;pulling=true;cloudState='connecting';

    try{await pullChanges(mark);if(!cloudReady){cloudReady=true;unsynced().forEach(k=>cloudPut(k))}cloudState='synced';vaultSync();checkOwner();phFlush();if(typeof gRestore==='function')gRestore();if(tab==='home')render()}
    catch(e){if(e&&e.code==='permission-denied'){cloudState='blocked';blockReason=fbUser&&fbUser.emailVerified?'invite':'verify';if(tab==='home')render()}else cloudState='error'}
    pulling=false;refreshSettings();return}
  try{const snap=await fb.F.getDocs(fb.F.collection(fb.db,'users',fbUser.uid,'data'));let maxU=0;snap.forEach(d=>{maxU=Math.max(maxU,uMs(d.data()))});
    const C={settings:null,custom:[],routines:[],weights:[],workouts:[],active:null,food:{},foods:[]};let any=false;
    snap.forEach(d=>{const v=d.data()||{};any=true;if(d.id==='settings'){C.settings=v.settings;C.custom=v.custom||[];C.routines=v.routines||[]}else if(d.id==='weights')C.weights=v.list||[];else if(d.id==='active')C.active=v.w||null;else if(d.id.startsWith('wk_')){knownMonths.add(d.id);C.workouts.push(...(v.list||[]))}else if(d.id==='foods')C.foods=v.list||[];else if(d.id.startsWith('fd_')){knownMonths.add(d.id);Object.assign(C.food,v.days||{})}});

      const days=new Set(S.weights.map(w=>w.d));for(const w of C.weights)if(!days.has(w.d))S.weights.push(w);S.weights.sort((a,b)=>a.d<b.d?-1:1);

      for(const d in C.food){const mine=S.food[d]||(S.food[d]=[]),have=new Set(mine.map(e=>e.id));for(const e of C.food[d])if(!have.has(e.id))mine.push(e)}
      {const have=new Set(S.foods.map(f=>f.n+'|'+(f.b||'')));for(const f of C.foods)if(!have.has(f.n+'|'+(f.b||'')))S.foods.push(f)}
      recomputePRs(S.workouts);cloudReady=true;saveAll()
    }else if(any){const typing=document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName);
      S={settings:Object.assign({unit:'kg',sex:'male',rest:120},C.settings||{}),custom:C.custom,routines:C.routines,weights:C.weights,workouts:C.workouts.sort((a,b)=>a.start-b.start),active:C.active,food:C.food,foods:C.foods};cloudReady=true;localSave();try{localStorage.removeItem(LS+'.unsynced')}catch(e){}migrate();if(!typing)render()}
    else{cloudReady=true;if(hasLocal())saveAll()}
    if(maxU)pullMarkSet({u:maxU,full:Date.now()});cloudState='synced';vaultSync();checkOwner();phFlush();if(typeof gRestore==='function')gRestore();if(tab==='home')render()
  }catch(e){if(e&&e.code==='permission-denied'){cloudState='blocked';blockReason=fbUser&&fbUser.emailVerified?'invite':'verify';if(tab==='home')render()}else cloudState='error'}
  pulling=false;refreshSettings()}

/* ---------- photo key ("vault") ----------
   Each account has one random AES key for its photos. The cloud only ever holds that key locked with a key stretched from the account password (PBKDF2),
   so photos can be opened on any device by signing in, but not by anyone who merely has access to the database. */
const b64=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kekFrom(password,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vaultWrap(password,key){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),raw=await crypto.subtle.exportKey('raw',key),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await kekFrom(password,salt),raw);return{v:1,salt:b64(salt),iv:b64(iv),key:b64(ct)}}
async function vaultUnwrap(password,doc){const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(doc.iv)},await kekFrom(password,unb64(doc.salt)),unb64(doc.key));return crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt'])}
async function vaultLocal(uid){try{return (await idbDo('readonly',s=>s.get(uid),'keys'))||null}catch(e){return null}}
const vaultRef=uid=>fb.F.doc(fb.db,'users',uid,'keys','vault');
async function vaultOpen(password){const u=fb.auth.currentUser;if(!u||!window.crypto||!crypto.subtle)return;let doc=null,reach=true;
  try{const sn=await fb.F.getDoc(vaultRef(u.uid));doc=sn.exists()?sn.data():null}catch(e){reach=false}
  let key=await vaultLocal(u.uid),rewrap=false;
  if(reach&&doc){try{key=await vaultUnwrap(password,doc)}catch(e){if(key)rewrap=true;else key=null}}   /* password was reset: a device that still has the key re-locks it with the new password */
  const fresh=!key;if(fresh)key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
  await idbDo('readwrite',s=>s.put(key,u.uid),'keys');
  if(fresh||rewrap||(reach&&!doc)||!reach){const w=await vaultWrap(password,key);let sent=false;if(reach){try{await fb.F.setDoc(vaultRef(u.uid),w);sent=true}catch(e){}}if(!sent)lsSet('.vaultPend.'+u.uid,JSON.stringify(w))}
  vaultKey=key;S.weights.filter(w=>w.p).forEach(w=>phMark(w.d,true));phFlush();refreshSettings()}
async function vaultSync(){const u=fbUser;if(!u)return;const k='.vaultPend.'+u.uid,p=lsGet(k);if(!p)return;
  try{const sn=await fb.F.getDoc(vaultRef(u.uid));if(!sn.exists())await fb.F.setDoc(vaultRef(u.uid),JSON.parse(p));
    else if(sn.data().key!==JSON.parse(p).key){vaultKey=null;await idbDo('readwrite',s=>s.delete(u.uid),'keys')}   /* another device set the key first: ask for the password again to pick it up */
    lsDel(k);phFlush();refreshSettings()}catch(e){}}
async function reauth(pw){await fb.U.reauthenticateWithCredential(fbUser,fb.U.EmailAuthProvider.credential(fbUser.email,pw))}

function thresholds(id){const t=STD[id];if(S.settings.sex!=='female')return t;return id==='pullup'?t.map(x=>1+(x-1)*.6):t.map(x=>x*FEM[id])}
/* A20: plain bodyweight multiples favour lighter lifters, so each lift is scaled with the DOTS bodyweight curve
   (the one powerlifting federations use) to what it would be at a reference bodyweight, 80 kg for men and 60 kg
   for women. At that bodyweight nothing changes; lighter lifters need a little more, heavier a little less. */
const DOTS={male:[-0.000001093,0.0007391293,-0.1918759221,24.0900756,-307.75076,40,210,80],female:[-0.0000010706,0.0005158568,-0.1126655495,13.6175032,-57.96288,40,150,60]};
function dotsFactor(bw){const c=DOTS[S.settings.sex==='female'?'female':'male'],f=x=>{x=Math.min(c[6],Math.max(c[5],x));return x*500/(c[0]*x**4+c[1]*x**3+c[2]*x**2+c[3]*x+c[4])};return bw>0?f(bw)/f(c[7]):1}
function rankFor(id){const bw=bwNow(),b=bestOf(V().workouts,id);if(!bw||!b)return null;const k=dotsFactor(bw),ratio=b.sc/bw*k,t=thresholds(id);let tier=0;while(tier<t.length&&ratio>=t[tier])tier++;
  const lo=tier?t[tier-1]:0,hi=t[tier];const prog=hi?Math.min(1,Math.max(0,(ratio-lo)/(hi-lo))):1;return{id,tier,prog,ratio,plain:b.sc/bw,kg:b.sc,nextKg:hi?hi*bw/k:null}}
function overall(){const rs=Object.keys(STD).map(rankFor).filter(Boolean);if(!rs.length)return null;const avg=rs.reduce((a,r)=>a+r.tier+(r.tier<6?r.prog:0),0)/rs.length;return{tier:Math.min(6,Math.floor(avg)),prog:avg%1,count:rs.length}}
function emblem(tier,size){const c=TIERS[tier][1],id='g'+tier+size;return `<svg class="emblem" width="${size}" height="${size}" viewBox="0 0 60 60" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".45"/></linearGradient></defs><path d="M30 3 53 16v28L30 57 7 44V16z" fill="url(#${id})" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/><path d="M30 12 45 20.5v19L30 48 15 39.5v-19z" fill="rgba(8,10,22,.55)"/><text x="30" y="36" text-anchor="middle" font-family="ui-rounded,Nunito,sans-serif" font-weight="900" font-size="17" fill="${c}">${TIERS[tier][0][0]}</text></svg>`}

function dockDragInit(){const row=$('#dockrow');if(!row)return;let st=null;const kids=()=>[...row.children];
  ['touchstart','touchmove','touchend'].forEach(t=>row.addEventListener(t,e=>e.stopPropagation(),{passive:true}));

function prevFor(pe,sets,j){if(!pe)return null;const warm=sets[j].t==='w',k=sets.slice(0,j).filter(q=>(q.t==='w')===warm).length;return(warm?(pe.warm||[]):pe.sets)[k]||null}
function exEntry(id){const pe=prevEx(id),work=pe&&pe.sets.length?pe.sets:[{},{},{}];return{exId:id,sets:((pe&&pe.warm)||[]).map(q=>({w:q.w??null,r:q.r??null,t:'w',done:false})).concat(work.map(q=>{const o={w:q.w??null,r:q.r??null,done:false};if(q.t==='d'||q.t==='f')o.t=q.t;return o}))}}
const restFor=exId=>{const o=(S.settings.exRest||{})[exId];return o==null?S.settings.rest:o},restLabel=exId=>{const o=(S.settings.exRest||{})[exId];return o==null?'default':o===0?'off':o+'s'};

/* ================= exercise insights ================= */
function lineChart(pts){if(pts.length<2)return '<div class="muted small">Log this in two or more sessions to see a chart.</div>';
  const W=320,H=150,px=8,py=16,t0=pts[0].t,t1=pts[pts.length-1].t,vals=pts.map(p=>p.v),lo=Math.min(...vals)*.97,hi=Math.max(...vals)*1.03||1;
  const X=t=>px+(W-2*px)*((t-t0)/Math.max(1,t1-t0)),Y=v=>py+(H-2*py)*(1-(v-lo)/Math.max(.001,hi-lo));
  const line=pts.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' '),last=pts[pts.length-1],best=pts.reduce((a,b)=>b.v>a.v?b:a);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated one-rep max over time"><defs><linearGradient id="el" x1="0" x2="1"><stop offset="0" stop-color="#7b6cff"/><stop offset="1" stop-color="#ff7a59"/></linearGradient><linearGradient id="ef" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a59" stop-opacity=".26"/><stop offset="1" stop-color="#7b6cff" stop-opacity="0"/></linearGradient></defs>
  ${[0,.5,1].map(f=>`<line x1="${px}" x2="${W-px}" y1="${py+(H-2*py)*f}" y2="${py+(H-2*py)*f}" stroke="rgba(255,255,255,.1)"/><text x="${px}" y="${py+(H-2*py)*f-3}" font-size="9" fill="rgb(245 247 252 / .72)">${disp(hi-(hi-lo)*f)} ${unit()}</text>`).join('')}
  <path d="${line} L${X(t1).toFixed(1)} ${H-py} L${X(t0).toFixed(1)} ${H-py} Z" fill="url(#ef)"/><path d="${line}" fill="none" stroke="url(#el)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="${X(best.t).toFixed(1)}" cy="${Y(best.v).toFixed(1)}" r="4" fill="#ffd166"/><circle cx="${X(last.t).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4.5" fill="#fff"/>${best!==last?`<text x="${Math.min(W-px,Math.max(px,X(best.t))).toFixed(1)}" y="${Math.max(9,Y(best.v)-8).toFixed(1)}" font-size="9" font-weight="700" text-anchor="${X(best.t)>W*.75?'end':X(best.t)<W*.25?'start':'middle'}" fill="#ffd166">Best ${disp(best.v)} ${unit()}</text>`:''}<text x="${(X(last.t)-7).toFixed(1)}" y="${Math.min(H-py-4,Y(last.v)+14).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="#fff">${best===last?'Best and latest ':'Latest '}${disp(last.v)} ${unit()}</text>

function exSheet(id){const ex=exById(id),ses=[];

  const u=unit(),r=STD[id]?rankFor(id):null,bw=bwNow();let body;
  if(!ses.length)body='<p>No sets logged for this exercise yet.</p>';
  else{const all=ses.flatMap(s=>s.sets),best=ses.reduce((a,b)=>b.sc>a.sc?b:a),bi=ses.indexOf(best),since=ses.length-1-bi,last=ses[ses.length-1];
    const heavy=all.reduce((a,b)=>(b.w||0)>(a.w||0)?b:a),volSet=all.reduce((a,b)=>(b.w||0)*(b.r||0)>(a.w||0)*(a.r||0)?b:a),reps=all.reduce((a,b)=>(b.r||0)>(a.r||0)?b:a),tot=ses.reduce((a,s)=>a+s.vol,0);

    const rm=[1,3,5,8,10,12].map(n=>[n,all.filter(s=>(s.r||0)>=n&&(s.w||0)>0).reduce((a,s)=>Math.max(a,s.w),0)]).filter(x=>x[1]>0),prs=ses.flatMap(s=>s.prs.map(p=>({...p,t:s.t}))).reverse().slice(0,8);
    body=`<div class="grid3"><div class="tile"><b>${disp(best.sc)}</b><span>est. 1RM (${u})</span></div><div class="tile"><b>${disp(heavy.w||0)}</b><span>heaviest (${u})</span></div><div class="tile"><b>${reps.r}</b><span>most reps</span></div>

const INFO={
 ranks:`<h2>How ranks work</h2><p>Each ranked lift takes your best set and converts it to an estimated one-rep max: weight × (1 + reps ÷ 30), the Epley formula. A single rep counts as the weight itself. Sets of more than 10 reps count as 10, because the formula overestimates beyond that; those sets still earn rep records.</p><p>That number is compared with your latest bodyweight on a ladder of bodyweight multiples for that lift. For example, at 80 kg a bench press of 1× bodyweight is Gold and 1.5× is Diamond. Pull-ups count your bodyweight on the day plus any added weight.</p><p>Bigger people can lift more but not in proportion to their weight, so plain multiples would favour lighter lifters. Apex evens this out with the DOTS formula used in powerlifting: it scales each lift to a reference bodyweight (80 kg for men, 60 kg for women). Lighter lifters need a slightly higher multiple for the same rank and heavier lifters a slightly lower one. The "next rank at" weights already include this.</p><p>Your overall rank is the average across the ranked lifts you have logged. The ladders are approximate, built from commonly used strength standards. They compare you with general lifting benchmarks, since this app has no other users to rank against.</p>`,
 trend:`<h2>How trend weight works</h2><p>Daily weight jumps around with water, salt and food. Trend weight smooths that out: each new weigh-in moves the trend 10% of the way toward the new reading.</p><p>The dots on the chart are your actual weigh-ins and the line is the trend. The 7-day and 30-day changes compare the trend now with the trend then, which is a better guide to real change than any single reading.</p>`};
