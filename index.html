<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apex">
<meta name="theme-color" content="#070913">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column of glass panels floating over a slow colour field; a floating glass tab bar; sheets rise from the bottom. Single dark theme by choice. */
:root{
  color-scheme:dark;
  --bg:#070913;
  --ink:#f5f7fc;
  --ink-2:rgba(245,247,252,.66);
  --ink-3:rgba(245,247,252,.42);
  --glass:rgba(255,255,255,.075);
  --glass-strong:rgba(255,255,255,.13);
  --edge:rgba(255,255,255,.2);
  --warm:#ff7a59;
  --cool:#7b6cff;
  --good:#5fe3a1;
  --gold:#ffd166;
  --bad:#ff6b6b;
  --display:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* colour field */
html{background:#060814}
.field{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100lvh;overflow:hidden;z-index:0;pointer-events:none;background:#060814}
.field i{position:absolute;inset:-30%;will-change:transform}
.field i:nth-child(1){background:radial-gradient(42% 36% at 28% 24%,rgba(92,74,255,.8),transparent 72%),radial-gradient(40% 36% at 78% 72%,rgba(0,160,215,.55),transparent 72%);animation:driftA 19s ease-in-out infinite alternate}
.field i:nth-child(2){background:radial-gradient(34% 30% at 76% 24%,rgba(255,112,92,.38),transparent 72%),radial-gradient(44% 38% at 18% 82%,rgba(150,84,255,.5),transparent 72%);animation:driftB 25s ease-in-out infinite alternate}
.field i:nth-child(3){inset:0;background:radial-gradient(130% 90% at 50% 10%,transparent 45%,rgba(3,4,10,.72))}
@keyframes driftA{to{transform:translate(9%,7%) rotate(10deg) scale(1.12)}}
@keyframes driftB{to{transform:translate(-8%,-6%) rotate(-12deg) scale(1.18)}}
@keyframes in{from{opacity:0;transform:translateY(22px) scale(.97)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pop{40%{transform:scale(1.25)}}
@keyframes fade{from{opacity:0}}
@keyframes inR{from{opacity:0;transform:translateX(46px)}}
@keyframes inL{from{opacity:0;transform:translateX(-46px)}}
@keyframes out{to{opacity:0;transform:scale(.965)}}
@keyframes outL{to{opacity:0;transform:translateX(-36px)}}
@keyframes outR{to{opacity:0;transform:translateX(36px)}}
.ghost{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;animation:out .26s cubic-bezier(.4,0,1,1) both}
.ghost.r{animation-name:outL}.ghost.l{animation-name:outR}
main.enter>*{animation:in .72s .17s cubic-bezier(.16,1,.3,1) both}
main.enter.r>*{animation-name:inR}main.enter.l>*{animation-name:inL}
nav{touch-action:none;-webkit-user-select:none;user-select:none}
main.enter>*:nth-child(2){animation-delay:.23s}main.enter>*:nth-child(3){animation-delay:.29s}main.enter>*:nth-child(4){animation-delay:.35s}main.enter>*:nth-child(5){animation-delay:.41s}main.enter>*:nth-child(n+6){animation-delay:.47s}
main.enter>*:nth-child(n+9){animation:none}
main.enter .track i{animation:grow 1.15s .3s cubic-bezier(.16,1,.3,1) both;transform-origin:left}
.check.pop{animation:pop .42s cubic-bezier(.3,1.4,.5,1)}
#scrim.on{animation:fade .32s}
#scrim.closing{opacity:0;transition:opacity .28s}
#scrim.closing #sheet{transform:translateY(46px) scale(.97)!important;opacity:0;transition:transform .28s cubic-bezier(.4,0,1,1),opacity .24s!important}
@media (prefers-reduced-motion:reduce){.ghost,.field i,main.enter>*,main.enter .track i,.check.pop,#scrim.on,#sheet{animation:none!important}*{transition:none!important}}

/* shell */
#app{position:relative;z-index:1;height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
main{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 26px) 18px calc(env(safe-area-inset-bottom) + 132px);display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 6px 4px}
.top h1{font-size:32px;font-weight:900;letter-spacing:-.4px;line-height:1.1}
.top .sub{color:var(--ink-2);font-size:14px;margin-bottom:2px}

/* glass */
.glass{position:relative;background:linear-gradient(160deg,var(--glass-strong),var(--glass) 45%,rgba(255,255,255,.04));
  border:1px solid var(--edge);border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 22px rgba(255,255,255,.04),0 14px 34px rgba(0,0,0,.32)}
.card{padding:20px}
.card h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2+*{margin-top:14px}
.muted{color:var(--ink-2)}.small{font-size:13px}
.info{color:var(--ink-3);font-size:12px;text-decoration:underline;text-underline-offset:3px;font-family:var(--body);font-weight:400}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{padding:14px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.tile b{display:block;font-family:var(--display);font-size:22px;line-height:1.2;margin-bottom:2px;font-weight:900;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--ink-2)}

#nav,#rest,#toast{-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.07) 45%,rgba(255,255,255,.035));contain:layout paint}
.tap{cursor:pointer}
.setbar{display:flex;gap:4px;padding:4px;border-radius:20px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.setbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:16px;font-size:10.5px;font-weight:600;color:var(--ink-2);transition:background .25s,color .25s}
.setbar button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.setbar button.on{background:rgba(255,255,255,.18);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.phstrip{display:flex;gap:10px;overflow-x:auto;touch-action:pan-x;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.ph{flex:none;width:96px;display:flex;flex-direction:column;gap:6px;align-items:center}
.ph img{width:96px;height:128px;object-fit:cover;border-radius:16px;background:rgba(255,255,255,.08);display:block}
.phfull{width:100%;border-radius:20px;display:block;background:rgba(255,255,255,.06);min-height:120px}
.fold{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s cubic-bezier(.22,1,.32,1),opacity .4s}
.hist.open .fold{grid-template-rows:1fr;opacity:1}
.foldin{overflow:hidden;min-height:0}
.foldin>*:first-child{margin-top:14px}
.ladder{display:flex;flex-wrap:wrap;gap:8px}
.ladder span{padding:6px 10px;border-radius:12px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.14);color:var(--ink-3);font-variant-numeric:tabular-nums}
.ladder span.got{background:rgba(255,255,255,.1)}
input[type=password]{width:100%;height:46px;padding:0 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);font-size:16px;box-sizing:border-box}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:700;
  background:rgba(255,255,255,.1);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:transform .12s,background .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#fff,#dfe5f5);color:#0b0d18;border-color:#fff;box-shadow:0 8px 24px rgba(255,255,255,.18)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.seg{display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1)}
.seg button{padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:rgba(255,255,255,.2);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);white-space:nowrap}
.chip.on{background:#fff;color:#0b0d18}
.pr{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.4px;background:var(--gold);color:#3a2a00}
input[type=text],input[type=number],input[type=date],select{width:100%;min-height:46px;padding:0 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);font-size:16px}
input::placeholder{color:var(--ink-3)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);min-width:0}
input[type=text],input[type=number],input[type=date],select{height:46px;box-sizing:border-box}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block;text-align:left;line-height:44px;padding-top:0;padding-bottom:0}
input::-webkit-date-and-time-value{margin:0;min-height:0}
input::-webkit-date-and-time-value{text-align:left}

/* tab bar */
#nav{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);width:min(508px,calc(100% - 32px));display:flex;padding:6px;border-radius:999px}
nav .di{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:999px;font-size:11px;font-weight:600;color:var(--ink-2)}
nav .di svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .di{cursor:pointer;position:relative;z-index:1;transition:color .25s,transform .12s}nav .di:active{transform:scale(.92)}
nav .di.on{color:var(--ink)}
nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/var(--n,5));border-radius:999px;background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 14px rgba(0,0,0,.2);transition:transform .58s cubic-bezier(.3,1.3,.45,1),opacity .3s}
nav .grab{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:72px;height:18px;flex:none;padding:0;z-index:2}
nav .grab::after{content:'';position:absolute;left:50%;top:8px;width:36px;height:4px;margin-left:-18px;border-radius:9px;background:rgba(255,255,255,.38)}
nav .grab:active{transform:translateX(-50%)}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 0}
#lscrim{position:fixed;inset:0;z-index:7;display:none;opacity:0;background:rgba(3,4,10,.5)}
#launch{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);width:min(508px,calc(100% - 32px));display:none;overflow:hidden;touch-action:none;
  -webkit-backdrop-filter:blur(36px) saturate(190%);backdrop-filter:blur(36px) saturate(190%);background:linear-gradient(170deg,rgba(255,255,255,.2),rgba(120,130,190,.14) 40%,rgba(20,24,48,.5))}
#linner{padding:10px 18px 20px;overflow-y:auto;transform-origin:50% 100%;box-sizing:border-box}
#linner h2{font-size:22px;font-weight:900}
#linner p{margin:8px 0 0}
#linner .grabline{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.32);margin:0 auto 14px}
.ltile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px 14px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:600;transition:transform .15s,background .3s,border-color .3s}
.ltile:active{transform:scale(.94)}
.ltile svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ltile em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3)}
.ltile.soon{color:var(--ink-3)}
.ltile.pinned{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5)}.ltile.pinned em{color:var(--good)}

/* rest pill */
#rest{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 86px);width:min(508px,calc(100% - 32px));padding:10px 12px 10px 18px;border-radius:999px;display:none;align-items:center;gap:10px;overflow:hidden}
#rest.on{display:flex}
#rest .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(123,108,255,.45),rgba(255,122,89,.45));z-index:-1;transition:width 1s linear}
#rest .t{font-family:var(--display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;min-width:64px}

/* workout */
.ex h3{font-size:17px;font-weight:800}
.sets{display:grid;grid-template-columns:30px 1fr 74px 64px 44px;gap:8px;align-items:center;margin-top:10px}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);text-align:center}
.sets .n{font-family:var(--display);font-weight:800;text-align:center;color:var(--ink-2)}
.sets .prev{font-size:13px;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.sets input{height:40px;min-height:40px;padding:0 4px;text-align:center;border-radius:12px;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.hx{position:absolute;left:50%;top:50%;margin:0;transform:translate(-50%,-50%) scale(2.4);opacity:.011;z-index:3;cursor:pointer}
.check .hx{transform:translate(-50%,-50%) scale(1.4)}
#nav .navhx{z-index:0;transform:translate(-50%,-50%) scale(6.4,2)}
.check,nav .di,div.btn,div.ltile,div.chip{overflow:hidden}
div.btn,div.ltile,div.chip{position:relative;cursor:pointer;-webkit-user-select:none;user-select:none}
div.chip{flex:none}
div.btn .hx{transform:translate(-50%,-50%) scale(9,2.6)}
div.ltile .hx{transform:translate(-50%,-50%) scale(2.6,3.6)}
.hapt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.check{position:relative;cursor:pointer;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;justify-self:center}
.check svg{width:18px;height:18px;stroke:var(--ink-3);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.check.on{background:var(--good);border-color:var(--good)}.check.on svg{stroke:#06281a}
.done input{background:rgba(95,227,161,.12);border-color:rgba(95,227,161,.3)}

/* lists */
.list{display:flex;flex-direction:column}
.list>*{padding:14px 0;border-top:1px solid rgba(255,255,255,.09)}
.list>*:first-child{border-top:0;padding-top:0}.list>*:last-child{padding-bottom:0}
.bars{display:flex;flex-direction:column;gap:12px}
.barrow{display:grid;grid-template-columns:92px 1fr 28px;gap:10px;align-items:center;font-size:13px}
.track{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cool),var(--warm))}
.banner{padding:14px 18px;line-height:1.45;border-radius:18px;font-size:13px;background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.35);color:#ffe6a8}
.emblem{flex:none}
.rankrow{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}

/* sheet */
#scrim{position:fixed;inset:0;z-index:10;background:rgba(3,4,10,.55);display:none;align-items:flex-end;justify-content:center;box-sizing:border-box;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 14px)}
#scrim.on{display:flex}
#sheet{width:min(508px,100%);box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;padding:10px 18px 22px;border-radius:36px;animation:rise .5s cubic-bezier(.16,1,.3,1);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);background:linear-gradient(180deg,rgba(40,44,70,.82),rgba(18,20,36,.9))}
#sheet{position:relative;z-index:2}
#sheet .peek-end{height:20px;line-height:20px;overflow:hidden;opacity:calc(1 - var(--p,0)*2.5);margin-bottom:calc(var(--p,0)*-32px);transform:scale(calc(1 - var(--p,0)*.15));transition:opacity .45s,margin-bottom .5s cubic-bezier(.22,1.02,.32,1),transform .45s}
#sheet .peek-end~*{opacity:calc(.25 + var(--p,0)*.75);transform:translateY(calc((1 - var(--p,0))*14px));transition:opacity .45s,transform .5s cubic-bezier(.22,1.02,.32,1)}
#sheet.dragging .peek-end,#sheet.dragging .peek-end~*{transition:none}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.34);margin:0 auto 14px}
#sheet>*:last-child{margin-bottom:0}
#sheet h2{font-size:22px;font-weight:900;margin-bottom:12px}
#sheet p{color:var(--ink-2);margin:0 0 10px;max-width:65ch}
.stack{display:flex;flex-direction:column;gap:12px}
@keyframes rise{from{transform:translateY(70px) scale(.96);opacity:0}}
#lock{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:24px;background:radial-gradient(60% 45% at 30% 20%,rgba(92,74,255,.55),transparent 70%),radial-gradient(55% 45% at 80% 85%,rgba(0,160,215,.4),transparent 70%),#060814}
#lock.on{display:grid}
.lockbox{width:min(360px,100%);display:flex;flex-direction:column;gap:14px;text-align:center;align-items:stretch}
.lockbox h2{font-size:26px;font-weight:900}.lockbox p{margin:0}
#lock-pin{text-align:center;font-size:22px;letter-spacing:6px}
#toast{position:fixed;z-index:70;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translate(-50%,calc(-100% - 80px));opacity:0;visibility:hidden;padding:10px 18px;border-radius:22px;font-size:14px;font-weight:600;transition:transform .3s,opacity .3s,visibility 0s .3s;max-width:90%}
#toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .3s,opacity .3s,visibility 0s}
.plates{display:flex;align-items:center;justify-content:center;gap:3px;height:120px;margin:6px 0}
.plates .barr{width:46px;height:10px;background:#aeb6c6;border-radius:3px}
.plates .p{width:16px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:800;color:#0b0d18;writing-mode:vertical-rl}
svg.chart{width:100%;height:auto;display:block}
</style>
</head>
<body>
<div class="field"><i></i><i></i><i></i></div>
<div id="app">
  <main id="view"></main>
</div>
<div id="rest" class="glass"><div class="bar" id="restbar"></div><span class="small muted">Rest</span><span class="t" id="restt">0:00</span><span style="flex:1"></span>
  <button class="btn sm" data-a="rest-adj" data-v="-15">−15</button><button class="btn sm" data-a="rest-adj" data-v="15">+15</button><button class="btn sm" data-a="rest-skip">Skip</button></div>
<nav class="glass" id="nav"></nav>
<div id="lscrim"></div>
<div id="launch" class="glass" role="dialog" aria-label="All features"><div id="linner"></div></div>
<div id="scrim"><div id="sheet" class="glass" role="dialog" aria-modal="true"></div></div>
<div id="lock" role="dialog" aria-modal="true" aria-label="App locked"></div>
<div id="toast" class="glass" role="status"></div>

<script src="config.js"></script>
<script>
/* ================= data ================= */
const MUSCLES=['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Core','Other'];
const LIB=[
['bench','Barbell Bench Press','Chest'],['incbench','Incline Barbell Bench Press','Chest'],['dbbench','Dumbbell Bench Press','Chest'],['incdb','Incline Dumbbell Press','Chest'],['fly','Cable Fly','Chest'],['pecdeck','Pec Deck','Chest'],['dip','Dip','Chest',1],['pushup','Push-Up','Chest',1],
['dead','Deadlift','Back'],['row','Barbell Row','Back'],['pullup','Pull-Up','Back',1],['chinup','Chin-Up','Back',1],['latpd','Lat Pulldown','Back'],['cablerow','Seated Cable Row','Back'],['dbrow','Dumbbell Row','Back'],['tbar','T-Bar Row','Back'],
['ohp','Overhead Press','Shoulders'],['dbohp','Dumbbell Shoulder Press','Shoulders'],['latraise','Lateral Raise','Shoulders'],['reardelt','Rear Delt Fly','Shoulders'],['facepull','Face Pull','Shoulders'],
['curl','Barbell Curl','Biceps'],['dbcurl','Dumbbell Curl','Biceps'],['hammer','Hammer Curl','Biceps'],['preacher','Preacher Curl','Biceps'],
['pushdown','Triceps Pushdown','Triceps'],['skull','Skullcrusher','Triceps'],['ohext','Overhead Triceps Extension','Triceps'],['cgbench','Close-Grip Bench Press','Triceps'],
['squat','Back Squat','Quads'],['fsquat','Front Squat','Quads'],['legpress','Leg Press','Quads'],['legext','Leg Extension','Quads'],['bss','Bulgarian Split Squat','Quads'],['hack','Hack Squat','Quads'],['lunge','Walking Lunge','Quads'],
['rdl','Romanian Deadlift','Hamstrings'],['legcurl','Leg Curl','Hamstrings'],['hipthrust','Hip Thrust','Glutes'],
['calf','Standing Calf Raise','Calves'],['seatcalf','Seated Calf Raise','Calves'],
['cablecrunch','Cable Crunch','Core'],['legraise','Hanging Leg Raise','Core',1],['abwheel','Ab Wheel Rollout','Core',1]
].map(a=>({id:a[0],name:a[1],muscle:a[2],bw:!!a[3]}));
const TIERS=[['Iron','#9aa3ad'],['Bronze','#d1915f'],['Silver','#d5dbe3'],['Gold','#ffd166'],['Platinum','#7fe6d3'],['Diamond','#8cc7ff'],['Titan','#c9a0ff']];
/* estimated 1RM as a multiple of bodyweight needed to reach Bronze … Titan (male) */
const STD={bench:[.5,.75,1,1.25,1.5,1.9],squat:[.75,1,1.35,1.75,2.1,2.6],dead:[1,1.25,1.6,2,2.5,3],ohp:[.35,.5,.65,.8,1,1.25],row:[.5,.7,.9,1.1,1.35,1.6],pullup:[1,1.1,1.25,1.45,1.7,2]};
const FEM={bench:.6,squat:.75,dead:.75,ohp:.62,row:.65};
const LB=2.20462, DAY=864e5, VERSION='0.26';

let S={settings:{unit:'kg',sex:'male',rest:120},custom:[],routines:[],weights:[],workouts:[],active:null,food:{},foods:[]};
let tab='home', expanded=null, pickFilter='All', pickQuery='', confirmCb=null, rest=null, DEMO=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uidGen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const unit=()=>S.settings.unit;
const disp=kg=>kg==null||kg===''?'':String(Math.round((unit()==='lb'?kg*LB:kg)*10)/10);
const toKg=v=>unit()==='lb'?v/LB:v;
const big=kg=>{const v=unit()==='lb'?kg*LB:kg;return v>=10000?(Math.round(v/100)/10)+'k':String(Math.round(v))};
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const monthKey=t=>'wk_'+ymd(t).slice(0,7);
const niceDate=t=>new Date(t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const dur=ms=>{const m=Math.max(0,Math.round(ms/6e4));return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m'};
const exById=id=>LIB.find(e=>e.id===id)||S.custom.find(e=>e.id===id)||{id,name:'Unknown exercise',muscle:'Other'};
const allEx=()=>LIB.concat(S.custom);
const isEmpty=()=>!S.workouts.length&&!S.weights.length&&!S.active;
const V=()=>isEmpty()?DEMO:S;           /* what the screens read: real data, or marked examples */
const bwNow=()=>{const w=V().weights;return w.length?w[w.length-1].kg:0};
const e1rm=(w,r)=>r<=1?w:w*(1+r/30);
function score(ex,set){const load=(set.w||0)+(ex.bw?bwNow():0);return load>0?e1rm(load,set.r||0):(set.r||0)/100}
function bestOf(list,exId){let b=null;const ex=exById(exId);for(const w of list)for(const e of w.exercises)if(e.exId===exId)for(const s of e.sets){const sc=score(ex,s);if(!b||sc>b.sc)b={sc,w:s.w||0,r:s.r,at:w.start}}return b}
function recomputePRs(list){list.sort((a,b)=>a.start-b.start);const best={};for(const w of list){w.prs=[];for(const e of w.exercises){const ex=exById(e.exId);let sc=0,wt=0;for(const s of e.sets){sc=Math.max(sc,score(ex,s));wt=Math.max(wt,s.w||0)}
  const b=best[e.exId];if(b){if(sc>b.sc+1e-6)w.prs.push({exId:e.exId,type:'Est. 1RM',kg:sc});else if(wt>b.wt+1e-6)w.prs.push({exId:e.exId,type:'Heaviest',kg:wt})}
  best[e.exId]={sc:Math.max(sc,b?b.sc:0),wt:Math.max(wt,b?b.wt:0)}}}}
const volume=w=>w.exercises.reduce((a,e)=>a+e.sets.reduce((x,s)=>x+(s.w||0)*(s.r||0),0),0);
const setCount=w=>w.exercises.reduce((a,e)=>a+e.sets.length,0);

function buildDemo(){const now=Date.now(),names=['Push','Legs','Pull'],plan=[['bench','ohp','incdb','pushdown'],['squat','rdl','legext','calf'],['dead','pullup','row','curl']],base={bench:72.5,ohp:45,incdb:26,pushdown:27.5,squat:95,rdl:85,legext:55,calf:70,dead:125,pullup:0,row:65,curl:32.5};
  const ws=[];for(let i=0;i<9;i++){const start=now-(20-i*2.3)*DAY;ws.push({id:'demo'+i,name:names[i%3]+' day',start,end:start+(55+i)*6e4,exercises:plan[i%3].map(x=>({exId:x,sets:[0,1,2].map(s=>({w:base[x]+Math.floor(i/3)*2.5,r:(x==='pullup'?9:8)-s+(i>5?1:0),done:true}))}))})}
  const weights=[];for(let i=29;i>=0;i--)weights.push({d:ymd(now-i*DAY),kg:Math.round((79.2-(29-i)*.035+Math.sin(i*1.7)*.35)*10)/10});
  DEMO={workouts:ws,weights,active:null};recomputePRs(ws)}

/* ================= storage ================= */
/* Everything is kept on this device (localStorage). If config.js holds a Firebase config and you sign in, the same data is mirrored to your own Firestore database under users/<your id>/data. */
const LS='apex.v1',CFG=(window.APEX_CONFIG||{}).firebase||null;
let blockReason='',isOwner=false,vaultKey=null;
const lsGet=k=>{try{return localStorage.getItem(LS+k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(LS+k,v)}catch(e){}},lsDel=k=>{try{localStorage.removeItem(LS+k)}catch(e){}};
let fb=null,fbUser=null,cloudReady=false,cloudState=CFG?'connecting':'off',knownMonths=new Set(),pulling=false;
const pend={},busy={};
function localSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('This device is out of storage space. Export a backup.')}}
function localLoad(){try{const t=localStorage.getItem(LS);if(t){const o=JSON.parse(t);if(o&&Array.isArray(o.workouts))S=Object.assign(S,o)}}catch(e){}if(!S.food)S.food={};if(!S.foods)S.foods=[]}
function unsynced(){try{return JSON.parse(localStorage.getItem(LS+'.unsynced')||'[]')}catch(e){return[]}}
function markUnsynced(k,on){try{const s=new Set(unsynced());on?s.add(k):s.delete(k);localStorage.setItem(LS+'.unsynced',JSON.stringify([...s]))}catch(e){}}
const clone=o=>JSON.parse(JSON.stringify(o));
function docFor(key){if(key==='settings')return{settings:S.settings,custom:S.custom,routines:S.routines};if(key==='weights')return{list:S.weights};if(key==='active')return{w:S.active};if(key==='foods')return{list:S.foods};
  if(key.startsWith('fd_')){const days={},m=key.slice(3);for(const d in S.food)if(d.startsWith(m)&&S.food[d].length)days[d]=S.food[d];return{days}}
  return{list:S.workouts.filter(w=>monthKey(w.start)===key)}}
function cloudPut(key){markUnsynced(key,true);if(key.startsWith('wk_')||key.startsWith('fd_'))knownMonths.add(key);if(!cloudReady)return;pend[key]=clone(docFor(key));if(!busy[key])pump(key)}
async function pump(key){busy[key]=true;while(key in pend){const d=pend[key];delete pend[key];try{await fb.F.setDoc(fb.F.doc(fb.db,'users',fbUser.uid,'data',key),d);if(!(key in pend))markUnsynced(key,false)}catch(e){cloudState='error';toast('Could not sync. Your change is kept on this device and will sync later.')}}busy[key]=false}
let activeTimer=null;
function save(...keys){localSave();for(const k of keys){if(k==='active'){markUnsynced('active',true);clearTimeout(activeTimer);activeTimer=setTimeout(()=>cloudPut('active'),1500)}else cloudPut(k)}}
function saveAll(){localSave();const months=new Set(S.workouts.map(w=>monthKey(w.start)));Object.keys(S.food).forEach(d=>months.add('fd_'+d.slice(0,7)));knownMonths.forEach(m=>months.add(m));['settings','weights','active','foods',...months].forEach(cloudPut)}
const hasLocal=()=>!isEmpty()||S.custom.length>0||S.routines.length>0||Object.keys(S.food).length>0||S.foods.length>0;
async function initCloud(){if(!CFG){cloudState='off';return}
  try{const v='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,U,F]=await Promise.all([import(v+'firebase-app.js'),import(v+'firebase-auth.js'),import(v+'firebase-firestore.js')]);
    const app=A.initializeApp(CFG);fb={auth:U.getAuth(app),db:F.getFirestore(app),U,F};
    U.onAuthStateChanged(fb.auth,u=>{fbUser=u;cloudReady=false;isOwner=false;vaultKey=null;if(u){vaultLocal(u.uid).then(k=>{if(k&&!vaultKey&&fbUser&&fbUser.uid===u.uid){vaultKey=k;phFlush();refreshSettings()}});pull()}else{cloudState='signedout';refreshSettings();if(tab==='home')render();maybeAskLogin()}})
  }catch(e){cloudState='error';refreshSettings()}}
async function pull(){if(!fb||!fbUser||pulling)return;if(Object.keys(pend).length||Object.values(busy).some(Boolean))return;pulling=true;cloudState='connecting';
  try{const snap=await fb.F.getDocs(fb.F.collection(fb.db,'users',fbUser.uid,'data'));
    const C={settings:null,custom:[],routines:[],weights:[],workouts:[],active:null,food:{},foods:[]};let any=false;
    snap.forEach(d=>{const v=d.data()||{};any=true;if(d.id==='settings'){C.settings=v.settings;C.custom=v.custom||[];C.routines=v.routines||[]}else if(d.id==='weights')C.weights=v.list||[];else if(d.id==='active')C.active=v.w||null;else if(d.id.startsWith('wk_')){knownMonths.add(d.id);C.workouts.push(...(v.list||[]))}else if(d.id==='foods')C.foods=v.list||[];else if(d.id.startsWith('fd_')){knownMonths.add(d.id);Object.assign(C.food,v.days||{})}});
    const dirty=unsynced().length>0&&hasLocal();
    if(any&&dirty){ /* this device has changes the cloud has not seen: keep both sides */
      const ids=new Set(S.workouts.map(w=>w.id));for(const w of C.workouts)if(!ids.has(w.id))S.workouts.push(w);
      const days=new Set(S.weights.map(w=>w.d));for(const w of C.weights)if(!days.has(w.d))S.weights.push(w);S.weights.sort((a,b)=>a.d<b.d?-1:1);
      const cs=new Set(S.custom.map(c=>c.id));for(const c of C.custom)if(!cs.has(c.id))S.custom.push(c);
      const rs=new Set(S.routines.map(c=>c.id));for(const c of C.routines)if(!rs.has(c.id))S.routines.push(c);
      for(const d in C.food){const mine=S.food[d]||(S.food[d]=[]),have=new Set(mine.map(e=>e.id));for(const e of C.food[d])if(!have.has(e.id))mine.push(e)}
      {const have=new Set(S.foods.map(f=>f.n+'|'+(f.b||'')));for(const f of C.foods)if(!have.has(f.n+'|'+(f.b||'')))S.foods.push(f)}
      recomputePRs(S.workouts);cloudReady=true;saveAll()
    }else if(any){const typing=document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName);
      S={settings:Object.assign({unit:'kg',sex:'male',rest:120},C.settings||{}),custom:C.custom,routines:C.routines,weights:C.weights,workouts:C.workouts.sort((a,b)=>a.start-b.start),active:C.active,food:C.food,foods:C.foods};cloudReady=true;localSave();try{localStorage.removeItem(LS+'.unsynced')}catch(e){}migrate();if(!typing)render()}
    else{cloudReady=true;if(hasLocal())saveAll()}
    cloudState='synced';vaultSync();checkOwner();phFlush();if(tab==='home')render()
  }catch(e){if(e&&e.code==='permission-denied'){cloudState='blocked';blockReason=fbUser&&fbUser.emailVerified?'invite':'verify';if(tab==='home')render()}else cloudState='error'}
  pulling=false;refreshSettings()}
function loginSheet(){openSheet(`<h2>Sign in to keep your training</h2><p>Right now everything is stored only on this device. Sign in and it backs up automatically and stays in step across your phone and computer. New here? Enter an email and a password, then choose Create account.</p>
  <div class="stack"><input type="text" inputmode="email" autocomplete="email" autocapitalize="off" id="au-email" placeholder="Email"><input type="password" autocomplete="current-password" id="au-pass" placeholder="Password">
  <div class="row"><button class="btn" style="flex:1" data-a="signup">Create account</button><button class="btn primary" style="flex:1" data-a="signin">Sign in</button></div><div class="row between"><button class="info" data-a="forgot">Forgot password</button><button class="info" data-a="close">Not now</button></div></div>`,'login')}
function maybeAskLogin(){try{if(localStorage.getItem(LS+'.loginAsked'))return;localStorage.setItem(LS+'.loginAsked','1')}catch(e){return}
  setTimeout(()=>{if(cloudState==='signedout'&&!S.active&&!$('#scrim').classList.contains('on')&&!L.open)loginSheet()},1400)}
function refreshSettings(){if($('#scrim').classList.contains('on')&&$('#sheet').dataset.kind==='settings')settingsSheet()}
const AUTHMSG={'auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.','auth/requires-recent-login':'Sign out, sign back in, then try again.','auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'No account with that email. Use Create account.','auth/email-already-in-use':'That email already has an account. Use Sign in.','auth/weak-password':'Use a password of at least 6 characters.','auth/invalid-email':'That email address does not look right.','auth/network-request-failed':'No connection. Try again when you are online.','auth/operation-not-allowed':'Email sign-in is not switched on in your Firebase project yet.'};
async function authGo(create){const em=$('#au-email').value.trim(),pw=$('#au-pass').value;if(!em||!pw){toast('Enter your email and a password.');return}
  try{const cred=await (create?fb.U.createUserWithEmailAndPassword:fb.U.signInWithEmailAndPassword)(fb.auth,em,pw);
    if(create){try{await fb.U.sendEmailVerification(cred.user)}catch(e){}}
    toast(create?'Account created. Check your inbox for a verification email.':'Signed in.');if($('#sheet').dataset.kind==='login')closeSheet();
    vaultOpen(pw).catch(()=>{})}catch(e){toast(AUTHMSG[e&&e.code]||'Could not sign in. Check your details and try again.')}}
async function forgotPassword(){const em=($('#au-email')||{}).value;if(!em||!em.trim()){toast('Type your email in the box first.');return}
  try{await fb.U.sendPasswordResetEmail(fb.auth,em.trim())}catch(e){if(e&&e.code==='auth/network-request-failed'){toast('No connection. Try again when you are online.');return}}
  toast('If that email has an account, a reset link is on its way.')}
async function verifyCheck(){try{await fbUser.reload();await fbUser.getIdToken(true)}catch(e){}if(fbUser&&!fbUser.emailVerified)toast('Not verified yet. Open the link in the email first.');pull()}
async function checkOwner(){try{await fb.F.getDocs(fb.F.query(fb.F.collection(fb.db,'invites'),fb.F.limit(1)));isOwner=true}catch(e){isOwner=false}refreshSettings()}

/* ---------- photo key ("vault") ----------
   Each account has one random AES key for its photos. The cloud only ever holds that key locked with a key stretched from the account password (PBKDF2),
   so photos can be opened on any device by signing in, but not by anyone who merely has access to the database. */
const b64=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kekFrom(password,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vaultWrap(password,key){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),raw=await crypto.subtle.exportKey('raw',key),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await kekFrom(password,salt),raw);return{v:1,salt:b64(salt),iv:b64(iv),key:b64(ct)}}
async function vaultUnwrap(password,doc){const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(doc.iv)},await kekFrom(password,unb64(doc.salt)),unb64(doc.key));return crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt'])}
async function vaultLocal(uid){try{return (await idbDo('readonly',s=>s.get(uid),'keys'))||null}catch(e){return null}}
const vaultRef=uid=>fb.F.doc(fb.db,'users',uid,'keys','vault');
async function vaultOpen(password){const u=fb.auth.currentUser;if(!u||!window.crypto||!crypto.subtle)return;let doc=null,reach=true;
  try{const sn=await fb.F.getDoc(vaultRef(u.uid));doc=sn.exists()?sn.data():null}catch(e){reach=false}
  let key=await vaultLocal(u.uid),rewrap=false;
  if(reach&&doc){try{key=await vaultUnwrap(password,doc)}catch(e){if(key)rewrap=true;else key=null}}   /* password was reset: a device that still has the key re-locks it with the new password */
  const fresh=!key;if(fresh)key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
  await idbDo('readwrite',s=>s.put(key,u.uid),'keys');
  if(fresh||rewrap||(reach&&!doc)||!reach){const w=await vaultWrap(password,key);let sent=false;if(reach){try{await fb.F.setDoc(vaultRef(u.uid),w);sent=true}catch(e){}}if(!sent)lsSet('.vaultPend.'+u.uid,JSON.stringify(w))}
  vaultKey=key;S.weights.filter(w=>w.p).forEach(w=>phMark(w.d,true));phFlush();refreshSettings()}
async function vaultSync(){const u=fbUser;if(!u)return;const k='.vaultPend.'+u.uid,p=lsGet(k);if(!p)return;
  try{const sn=await fb.F.getDoc(vaultRef(u.uid));if(!sn.exists())await fb.F.setDoc(vaultRef(u.uid),JSON.parse(p));
    else if(sn.data().key!==JSON.parse(p).key){vaultKey=null;await idbDo('readwrite',s=>s.delete(u.uid),'keys')}   /* another device set the key first: ask for the password again to pick it up */
    lsDel(k);phFlush();refreshSettings()}catch(e){}}
async function reauth(pw){await fb.U.reauthenticateWithCredential(fbUser,fb.U.EmailAuthProvider.credential(fbUser.email,pw))}
async function vaultOn(){const pw=($('#vault-pw')||{}).value;if(!pw){toast('Enter your account password.');return}try{await reauth(pw)}catch(e){toast(AUTHMSG[e&&e.code]||'That password did not match.');return}
  try{await vaultOpen(pw);toast('Photo encryption is on.')}catch(e){toast('Could not switch on encryption. Try again.')}}
async function wipeLocal(){S={settings:{unit:'kg',sex:'male',rest:120},custom:[],routines:[],weights:[],workouts:[],active:null,food:{},foods:[]};for(const k of Object.keys(phCache))delete phCache[k];
  try{Object.keys(localStorage).filter(k=>k.startsWith(LS)&&k!==LS+'.loginAsked').forEach(k=>localStorage.removeItem(k))}catch(e){}
  try{await idbDo('readwrite',s=>s.clear())}catch(e){}try{await idbDo('readwrite',s=>s.clear(),'keys')}catch(e){}knownMonths=new Set()}
async function deleteAccount(){const pw=($('#del-pw')||{}).value;if(!pw){toast('Enter your password to confirm.');return}
  try{await reauth(pw)}catch(e){toast(AUTHMSG[e&&e.code]||'That password did not match.');return}
  toast('Deleting…');const F=fb.F,uid=fbUser.uid;
  try{for(const w of S.weights.filter(w=>w.p))await F.deleteDoc(F.doc(fb.db,'users',uid,'photos',w.d)).catch(()=>{});
    const sn=await F.getDocs(F.collection(fb.db,'users',uid,'data'));for(const d of sn.docs)await F.deleteDoc(d.ref);await F.deleteDoc(vaultRef(uid)).catch(()=>{})}catch(e){}
  try{await fb.U.deleteUser(fbUser)}catch(e){toast('Your data was removed but the login could not be deleted. Sign in again and retry.');return}
  await wipeLocal();closeSheet();go('home');toast('Account and data deleted.')}
function deleteSheet(){openSheet(`<h2>Delete account</h2><p>This permanently deletes your login and everything stored with it: workouts, weigh-ins, photos, routines. It also clears this device. It cannot be undone, so export a backup first if you want one.</p><div class="stack"><input type="password" autocomplete="current-password" id="del-pw" placeholder="Your password"><div class="row"><button class="btn" style="flex:1" data-a="close">Keep my account</button><button class="btn danger" style="flex:1" data-a="delete-account">Delete forever</button></div></div>`,'delete')}
async function invitesSheet(){let list=[];try{const sn=await fb.F.getDocs(fb.F.collection(fb.db,'invites'));sn.forEach(d=>list.push(d.id))}catch(e){toast('Could not load the invite list.');return}
  openSheet(`<h2>Invite friends</h2><p>Only email addresses on this list can sync with your project. A friend signs up in the app with the same address and confirms it from the verification email.</p><div class="stack"><div class="row"><input type="text" inputmode="email" autocapitalize="off" id="inv-email" placeholder="friend@example.com"><button class="btn" data-a="invite-add">Add</button></div>
  ${list.length?`<div class="list">${list.sort().map(e=>`<div class="row between"><span style="min-width:0;overflow-wrap:anywhere">${esc(e)}</span><button class="btn sm danger" data-a="invite-del" data-v="${esc(e)}">Remove</button></div>`).join('')}</div>`:'<div class="muted small">Nobody invited yet.</div>'}</div>`,'invites')}

/* ---------- app lock (this device only) ---------- */
const pinGet=()=>{try{return JSON.parse(lsGet('.pin')||'null')}catch(e){return null}};
async function pinHash(pin,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:150000,hash:'SHA-256'},base,256))}
function lockShow(forgot){const el=$('#lock');el.classList.add('on');el.innerHTML=forgot?`<div class="lockbox"><h2>Forgot your PIN?</h2><p class="muted">The only way back in is to erase this device's copy and remove the PIN. Anything synced to your account stays safe and returns when you sign in. Anything never synced is lost.</p><button class="btn danger block" data-a="lock-erase">Erase this device and remove PIN</button><button class="btn block" data-a="lock-back">Back</button></div>`
  :`<div class="lockbox"><h2>Apex is locked</h2><p class="muted">Enter your PIN to continue.</p><input type="password" inputmode="numeric" autocomplete="off" id="lock-pin" placeholder="PIN" aria-label="PIN"><button class="btn primary block" data-a="unlock">Unlock</button><button class="info" data-a="lock-forgot">Forgot PIN</button></div>`}
async function unlock(){const p=pinGet(),i=$('#lock-pin');if(!p||!i)return;if(await pinHash(i.value,p.salt)===p.hash){$('#lock').classList.remove('on');$('#lock').innerHTML=''}else{i.value='';toast('Wrong PIN.')}}
function pinSheet(){const on=!!pinGet();openSheet(on?`<h2>Turn off app lock</h2><div class="stack"><input type="password" inputmode="numeric" autocomplete="off" id="pin-a" placeholder="Current PIN"><button class="btn block" data-a="pin-off">Turn off</button></div>`
  :`<h2>Set an app lock</h2><p>Apex will ask for this PIN when it opens and after it has been in the background for a minute. It protects this device only; set it separately on each one.</p><div class="stack"><input type="password" inputmode="numeric" autocomplete="off" id="pin-a" placeholder="PIN, 4 to 8 digits"><input type="password" inputmode="numeric" autocomplete="off" id="pin-b" placeholder="Same PIN again"><button class="btn primary block" data-a="pin-save">Turn on app lock</button></div>`,'pin')}
async function pinSave(){const a=$('#pin-a').value,b2=$('#pin-b').value;if(!/^\d{4,8}$/.test(a)){toast('Use 4 to 8 digits.');return}if(a!==b2){toast('The two PINs do not match.');return}const salt=b64(crypto.getRandomValues(new Uint8Array(16)));lsSet('.pin',JSON.stringify({salt,hash:await pinHash(a,salt)}));closeSheet();toast('App lock is on.')}
async function pinOff(){const p=pinGet();if(p&&await pinHash($('#pin-a').value,p.salt)!==p.hash){toast('Wrong PIN.');return}lsDel('.pin');closeSheet();toast('App lock is off.')}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')hiddenAt=Date.now();else if(pinGet()&&hiddenAt&&Date.now()-hiddenAt>60000&&!$('#lock').classList.contains('on'))lockShow()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){pull();checkUpdate(false)}});
window.addEventListener('online',()=>pull());

/* ================= ranks ================= */
function thresholds(id){const t=STD[id];if(S.settings.sex!=='female')return t;return id==='pullup'?t.map(x=>1+(x-1)*.6):t.map(x=>x*FEM[id])}
function rankFor(id){const bw=bwNow(),b=bestOf(V().workouts,id);if(!bw||!b)return null;const ratio=b.sc/bw,t=thresholds(id);let tier=0;while(tier<t.length&&ratio>=t[tier])tier++;
  const lo=tier?t[tier-1]:0,hi=t[tier];const prog=hi?Math.min(1,Math.max(0,(ratio-lo)/(hi-lo))):1;return{id,tier,prog,ratio,kg:b.sc,nextKg:hi?hi*bw:null}}
function overall(){const rs=Object.keys(STD).map(rankFor).filter(Boolean);if(!rs.length)return null;const avg=rs.reduce((a,r)=>a+r.tier+(r.tier<6?r.prog:0),0)/rs.length;return{tier:Math.min(6,Math.floor(avg)),prog:avg%1,count:rs.length}}
function emblem(tier,size){const c=TIERS[tier][1],id='g'+tier+size;return `<svg class="emblem" width="${size}" height="${size}" viewBox="0 0 60 60" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".45"/></linearGradient></defs><path d="M30 3 53 16v28L30 57 7 44V16z" fill="url(#${id})" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/><path d="M30 12 45 20.5v19L30 48 15 39.5v-19z" fill="rgba(8,10,22,.55)"/><text x="30" y="36" text-anchor="middle" font-family="ui-rounded,Nunito,sans-serif" font-weight="900" font-size="17" fill="${c}">${TIERS[tier][0][0]}</text></svg>`}

/* Everything the app can open. kind: screen (a tab), tool (opens a sheet), soon (planned, shown as a placeholder). New features get added here and can then be pinned to the dock. */
const ITEMS={home:{label:'Home',kind:'screen'},train:{label:'Train',kind:'screen'},history:{label:'History',kind:'screen'},ranks:{label:'Ranks',kind:'screen'},body:{label:'Body',kind:'screen'},
  plates:{label:'Plates',kind:'tool'},settings:{label:'Settings',kind:'tool'},
  food:{label:'Nutrition',kind:'screen'},scan:{label:'Scan food',kind:'tool'},coach:{label:'Coach',kind:'soon',note:'the workout generator update'},studies:{label:'Studies',kind:'soon',note:'a later update'},share:{label:'Share card',kind:'soon',note:'a later update'}};
const SCREENS=Object.keys(ITEMS).filter(k=>ITEMS[k].kind==='screen'),DEFAULT_DOCK=['home','train','history','ranks','body'];
let dockEdit=false,navDragging=false;
/* An invisible iOS switch laid over a control. A real finger tap on a switch is the one case where iOS still gives web pages a haptic tick. */
/* withTicks rewrites buttons in a screen's markup into tappable blocks that carry the hidden switch. */
const withTicks=html=>html.replace(/<button (class="(?:btn|ltile|chip)[\s\S]*?)>([\s\S]*?)<\/button>/g,(m,a,b)=>`<div role="button" tabindex="0" ${a}>${b}${HX}</div>`);
const HX='<input type="checkbox" switch class="hx" tabindex="-1" aria-hidden="true">';
function dock(){const d=(S.settings.dock||DEFAULT_DOCK).filter(id=>ITEMS[id]&&ITEMS[id].kind!=='soon');return d.length>=2?d.slice(0,5):DEFAULT_DOCK}
const swipeOrder=()=>{const d=dock().filter(id=>ITEMS[id].kind==='screen');return d.includes(tab)?d:SCREENS};
function buildNav(){const d=dock(),nav=$('#nav');nav.dataset.sig=d.join();nav.style.setProperty('--n',d.length);nav.innerHTML='<button class="grab" data-a="launcher" aria-label="Open all features"></button><input type="checkbox" switch class="hx navhx" tabindex="-1" aria-hidden="true"><span class="ind"></span>'+d.map(k=>`<div class="di" role="button" tabindex="0" data-a="open" data-v="${k}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${ITEMS[k].label}${HX}</div>`).join('')}
function renderNav(){const d=dock(),nav=$('#nav');if(nav.dataset.sig!==d.join())buildNav();const i=d.indexOf(tab);document.querySelectorAll('#nav .di').forEach((b,j)=>{b.classList.toggle('on',i===j);b.setAttribute('aria-current',i===j?'page':'false')});const ind=document.querySelector('#nav .ind');if(ind&&!navDragging){ind.style.opacity=i<0?0:1;if(i>=0)ind.style.transform='translateX('+i*100+'%)'}}
function openItem(id){const it=ITEMS[id];if(!it)return;if(it.kind==='soon'){toast(it.label+' arrives in '+it.note+'.');return}launcherClose();if(it.kind==='screen'){closeSheet();go(id)}else if(id==='plates')platesSheet();else if(id==='scan'){closeSheet();if(tab!=='food')go('food');nutAction('fd-scan')}else if(id==='settings')settingsSheet()}
/* The launcher is a floating panel that starts at the dock's exact size and shape and grows upward. p is how open it is, 0 to 1, so a finger can drive it directly. */
const L={open:false,full:false,p:0,H:0,HF:0,dockH:64,timer:null}; /* p: 0 = dock, 1 = open, 2 = full screen */
function launcherRender(){const d=dock(),tile=id=>{const it=ITEMS[id],pinned=d.includes(id),soon=it.kind==='soon';
    return `<button class="ltile ${soon?'soon':''} ${dockEdit&&pinned?'pinned':''}" data-a="${dockEdit&&!soon?'pin':'open'}" data-v="${id}"><svg viewBox="0 0 24 24">${ICON[id]}</svg><span>${it.label}</span>${soon?'<em>Soon</em>':dockEdit?`<em>${pinned?'In dock':'Add'}</em>`:''}</button>`};
  const inner=$('#linner'),el=$('#launch');L.dockH=$('#nav').offsetHeight||64;
  if(el.style.display!=='block'){el.style.transition='none';el.style.height=L.dockH+'px';el.style.display='block'}
  inner.style.height='auto';
  inner.innerHTML=withTicks(`<div class="grabline"></div><div class="row between"><h2>${dockEdit?'Choose your dock':'All features'}</h2><button class="btn sm" data-a="dock-edit">${dockEdit?'Done':'Edit dock'}</button></div>
  <p class="small muted">${dockEdit?'Tap to add or remove. The dock holds 2 to 5 items.':'Tap one to open it. Pull up for full screen, down to close.'}</p><div class="lgrid">${Object.keys(ITEMS).map(tile).join('')}</div>`);
  L.H=Math.max(L.dockH+1,Math.min(inner.scrollHeight,Math.round((window.innerHeight||700)*.76)));inner.style.height=L.H+'px';
  let top=59;try{top=parseFloat(getComputedStyle($('#scrim')).paddingTop)||59}catch(e){}
  let bottom=0;try{bottom=$('#nav').getBoundingClientRect().bottom}catch(e){}L.HF=Math.max(L.H,Math.round((bottom||((window.innerHeight||700)-14))-top))}
const lHeight=p=>p<=1?L.dockH+(L.H-L.dockH)*p:L.H+(L.HF-L.H)*(p-1);
const lFromH=hh=>hh<=L.H?(hh-L.dockH)/(L.H-L.dockH):1+(L.HF>L.H?(hh-L.H)/(L.HF-L.H):0);
function launcherSet(q,anim){q=Math.max(0,Math.min(2,q));L.p=q;const p=Math.min(1,q);const el=$('#launch'),inner=$('#linner'),nav=$('#nav'),sc=$('#lscrim'),t=anim?'.62s cubic-bezier(.22,1.02,.32,1)':'0s';
  clearTimeout(L.timer);el.style.display='block';sc.style.display='block';
  el.style.transition='height '+t+',border-radius '+t;inner.style.transition='opacity '+t+',transform '+t;nav.style.transition='opacity '+(anim?'.4s':'0s');sc.style.transition='opacity '+t;
  el.style.height=lHeight(q)+'px';inner.style.height=Math.max(L.H,lHeight(q))+'px';el.style.borderRadius=(L.dockH/2+(36-L.dockH/2)*Math.min(1,p*2.2))+'px';
  inner.style.opacity=Math.max(0,Math.min(1,(p-.18)/.5));inner.style.transform='scale('+(.9+.1*p)+')';nav.style.opacity=Math.max(0,1-p*3.2);sc.style.opacity=p;sc.style.pointerEvents=p>.5?'auto':'none';
  if(p===0)L.timer=setTimeout(()=>{if(L.p===0){el.style.display='none';sc.style.display='none'}},anim?640:0)}
function launcherOpen(full){if(L.p===0){dockEdit=false;launcherRender();launcherSet(0,false);void $('#launch').offsetHeight}L.open=true;L.full=!!full&&L.HF-L.H>24;launcherSet(L.full?2:1,true)}
function launcherClose(){if(!L.open&&L.p===0)return;L.open=false;L.full=false;launcherSet(0,true)}
function launcherRefresh(){launcherRender();launcherSet(L.full?2:1,true)}
const demoBanner=()=>isEmpty()?`<div class="banner">You are looking at example data so you can see how each screen works. It disappears as soon as you log your first workout or weigh-in.</div>`:'';
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function streak(list){let ws=weekStart(),n=0;const has=s=>list.some(w=>w.start>=s&&w.start<s+7*DAY);if(!has(ws))ws-=7*DAY;while(has(ws)){n++;ws-=7*DAY}return n}

function home(){const d=V(),ws=weekStart(),wk=d.workouts.filter(w=>w.start>=ws),o=overall();
  const mus={};for(const w of wk)for(const e of w.exercises){const m=exById(e.exId).muscle;mus[m]=(mus[m]||0)+e.sets.length}
  const mlist=Object.entries(mus).sort((a,b)=>b[1]-a[1]),mmax=Math.max(1,...mlist.map(m=>m[1]));
  const prs=[];for(const w of d.workouts.slice().reverse())for(const p of w.prs||[]){if(prs.length<5)prs.push({...p,at:w.start})}
  return `<div class="top"><div><div class="sub">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</div><h1>Apex</h1></div>
    <button class="iconbtn glass" data-a="settings" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
  ${demoBanner()}
  ${cloudState==='signedout'?`<button class="btn block" data-a="login">Sign in to sync and back up your training</button>`:cloudState==='blocked'?`<button class="btn block" data-a="settings-account">Finish setting up sync</button>`:''}
  <section class="glass card tap" data-a="tab" data-v="ranks"><div class="row" style="gap:16px">${o?emblem(o.tier,76):emblem(0,76)}<div style="flex:1;min-width:0">
    <div class="small muted">Overall rank <button class="info" data-a="info" data-v="ranks">How ranks work</button></div>
    <div class="num" style="font-size:30px;font-weight:900;line-height:1.1">${o?TIERS[o.tier][0]:'Unranked'}</div>
    ${o?(o.tier<6?`<div class="track" style="margin-top:8px"><i style="width:${Math.round(o.prog*100)}%"></i></div><div class="small muted" style="margin-top:6px">${Math.round(o.prog*100)}% of the way to ${TIERS[o.tier+1][0]}, from ${o.count} ranked lift${o.count>1?'s':''}</div>`:'<div class="small muted">Top tier reached</div>'):'<div class="small muted">Log your bodyweight and a ranked lift to get a rank.</div>'}
  </div></div></section>
  ${typeof nutHome==='function'?nutHome():''}
  <button class="btn primary block" data-a="${S.active?'tab':'start'}" data-v="train">${S.active?'Continue workout':'Start workout'}</button>

    <div class="tile"><b>${wk.length}</b><span>workouts</span></div>

  <section class="glass card"><h2>Recent records</h2>${prs.length?`<div class="list">${prs.map(p=>`<div class="row between tap" data-a="ex" data-v="${esc(p.exId)}"><div><div style="font-weight:600">${esc(exById(p.exId).name)}</div><div class="small muted">${p.type} · ${niceDate(p.at)}</div></div><div class="row"><span class="num" style="font-weight:800">${disp(p.kg)} ${unit()}</span><span class="pr">PR</span></div></div>`).join('')}</div>`:'<div class="muted small">Records appear here when you beat a previous best.</div>'}</section>`}

function prevSets(exId){const l=S.workouts;for(let i=l.length-1;i>=0;i--){const e=l[i].exercises.find(x=>x.exId===exId);if(e)return e.sets}return null}
function train(){const a=S.active;if(!a){const last=S.workouts[S.workouts.length-1];
  return `<div class="top"><h1>Train</h1><button class="btn sm" data-a="plates">Plate calculator</button></div>${demoBanner()}

  return `<div class="top"><div style="min-width:0;flex:1"><input type="text" id="wname" data-i="wname" value="${esc(a.name)}" aria-label="Workout name" style="background:none;border:0;padding:0;font-family:var(--display);font-size:28px;font-weight:900;min-height:0"><div class="sub num" id="elapsed"></div></div><button class="btn sm" data-a="plates">Plates</button></div>

    ${e.sets.map((s,j)=>{const p=prev&&prev[j],isPr=s.done&&best&&score(ex,s)>best.sc+1e-6;
      return `<span class="n">${isPr?'<span class="pr">PR</span>':j+1}</span><span class="prev">${p?disp(p.w||0)+' × '+p.r:'—'}</span>
      <span class="${s.done?'done':''}"><input type="number" inputmode="decimal" step="any" id="w-${i}-${j}" data-i="set" data-x="${i}" data-s="${j}" data-f="w" value="${disp(s.w)}" placeholder="${p?disp(p.w||0):'0'}" aria-label="Weight, set ${j+1}"></span>
      <span class="${s.done?'done':''}"><input type="number" inputmode="numeric" id="r-${i}-${j}" data-i="set" data-x="${i}" data-s="${j}" data-f="r" value="${s.r??''}" placeholder="${p?p.r:'0'}" aria-label="Reps, set ${j+1}"></span>

function lineChart(pts){if(pts.length<2)return '<div class="muted small">Log this in two or more sessions to see a chart.</div>';

function trend(list){let t=null;return list.map(w=>{t=t==null?w.kg:t+.1*(w.kg-t);return t})}

function body(){const l=V().weights,tr=trend(l),cur=l[l.length-1],tnow=tr[tr.length-1];
  const ago=n=>{if(!cur)return null;const cut=ymd(Date.now()-n*DAY);let idx=-1;for(let i=0;i<l.length;i++)if(l[i].d<=cut)idx=i;return idx<0?null:tnow-tr[idx]};

/* ================= progress photos ================= */
/* Photos are shrunk on the phone, kept in the browser's IndexedDB, and (when signed in) copied to users/<id>/photos/<date> so they are only downloaded when viewed. */
let idbP=null;const phCache={};
function idbOpen(){return idbP||(idbP=new Promise((res,rej)=>{const r=indexedDB.open('apex',2);r.onupgradeneeded=()=>{for(const n of ['photos','keys'])if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idbDo(mode,fn,store){store=store||'photos';const d=await idbOpen();return new Promise((res,rej)=>{const tx=d.transaction(store,mode),rq=fn(tx.objectStore(store));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
const phPending=()=>{try{return JSON.parse(localStorage.getItem(LS+'.phpend')||'[]')}catch(e){return[]}},phMark=(d,on)=>{try{const s=new Set(phPending());on?s.add(d):s.delete(d);localStorage.setItem(LS+'.phpend',JSON.stringify([...s]))}catch(e){}};
async function phGet(d){if(phCache[d])return phCache[d];let v=null;try{v=await idbDo('readonly',s=>s.get(d))}catch(e){}
  if(!v&&cloudReady){try{const sn=await fb.F.getDoc(fb.F.doc(fb.db,'users',fbUser.uid,'photos',d));if(sn.exists()){const x=sn.data();
      if(x.ct){if(vaultKey){const o=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(x.iv)},vaultKey,unb64(x.ct))));v={d,img:o.img,th:o.th}}}else if(x.img)v={d,img:x.img,th:x.th};
      if(v)idbDo('readwrite',s=>s.put(v,d)).catch(()=>{})}}catch(e){}}
  if(v)phCache[d]=v;return v}
/* A photo only leaves the device after it has been encrypted with the account's photo key, so the project owner cannot view it. Without the key it waits in the pending list. */
async function phPush(d){if(!cloudReady||!vaultKey)return;try{const v=await phGet(d);if(v){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},vaultKey,new TextEncoder().encode(JSON.stringify({img:v.img,th:v.th})));
    await fb.F.setDoc(fb.F.doc(fb.db,'users',fbUser.uid,'photos',d),{d,v:2,iv:b64(iv),ct:b64(ct)})}phMark(d,false)}catch(e){}}
function phFlush(){phPending().forEach(phPush)}
async function phSave(d,file){const img=await shrink(file,1280,.72),th=await shrink(file,260,.7),v={d,img,th};phCache[d]=v;await idbDo('readwrite',s=>s.put(v,d));phMark(d,true);phPush(d)}
function phRemove(d){delete phCache[d];phMark(d,false);idbDo('readwrite',s=>s.delete(d)).catch(()=>{});if(cloudReady)fb.F.deleteDoc(fb.F.doc(fb.db,'users',fbUser.uid,'photos',d)).catch(()=>{})}
function shrink(file,max,q){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))}catch(e){rej(e)}};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'))};im.src=url})}
function fillPhotos(){document.querySelectorAll('img[data-ph]').forEach(async im=>{if(im.dataset.done)return;im.dataset.done='1';const v=await phGet(im.dataset.ph);if(!v){im.alt='Photo not available on this device yet';return}if(im.dataset.full)im.onload=()=>sheetMeasure(true);im.src=im.dataset.full?v.img:v.th})}
function photoCard(l){const ph=l.filter(w=>w.p).reverse();if(isEmpty()||!ph.length)return '';
  return `<section class="glass card"><h2>Progress photos${ph.length>1?'<button class="btn sm" data-a="photo-compare">Compare</button>':''}</h2><div class="phstrip">${ph.slice(0,20).map(w=>`<button class="ph" data-a="photo" data-v="${w.d}"><img data-ph="${w.d}" alt="Progress photo from ${w.d}"><span class="small muted num">${new Date(w.d+'T12:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})} · ${disp(w.kg)}</span></button>`).join('')}</div></section>`}

function openSheet(html,kind){runCleanup();if(pushMode){pushMode=false;const sc0=$('#scrim');if(sc0.classList.contains('on')&&!sc0.classList.contains('closing')){pushSheet(html,kind);return}}

  case 'add-set':{const st=S.active.exercises[x].sets,l=st[st.length-1]||{};st.push({w:l.w??null,r:l.r??null,done:false});save('active');render();break}
  case 'rm-set':S.active.exercises[x].sets.pop();save('active');render();break;
  case 'check':{const e=S.active.exercises[x],st=e.sets[s],p=(prevSets(e.exId)||[])[s];if(!st.done){if(st.w==null&&p)st.w=p.w;if(st.r==null&&p)st.r=p.r;if(!(st.r>0)){toast('Enter reps first.');break}st.done=true;startRest()}else st.done=false;save('active');render();if(st.done){const c=document.querySelector(`[data-a="check"][data-x="${x}"][data-s="${s}"]`);c&&c.classList.add('pop')}break}
  case 'finish':finish();break;
  case 'cancel':confirmSheet('Discard this workout?','Nothing from this session will be saved.','Discard',()=>{S.active=null;stopRest();save('active');render()});break;
  case 'expand':{expanded=expanded===v?null:v;document.querySelectorAll('.hist.open').forEach(s=>{s.classList.remove('open');const eb=s.querySelector('[data-a=expand]');eb&&eb.setAttribute('aria-expanded','false')});
    if(expanded){const s=b.closest('.hist'),w=V().workouts.find(w=>w.id===v),inn=s&&s.querySelector('.foldin');if(inn&&w){if(!inn.innerHTML.trim())inn.innerHTML=withTicks(histDetail(w));void s.offsetHeight;s.classList.add('open');b.setAttribute('aria-expanded','true')}}break}
  case 'hist-more':{const v2=$('#view'),top=v2.scrollTop;histShown+=25;render();v2.scrollTop=top;break}
  case 'ex':exSheet(v);break;
  case 'login':loginSheet();break;
  case 'del-workout':confirmSheet('Delete this workout?','Records and ranks are recalculated without it.','Delete',()=>{const w=S.workouts.find(w=>w.id===v);S.workouts=S.workouts.filter(w=>w.id!==v);recomputePRs(S.workouts);save(monthKey(w.start));render()});break;
  case 'add-weight':{const val=parseFloat($('#bw-val').value),d=$('#bw-date').value||ymd(Date.now());if(!(val>0)){toast('Enter your weight first.');break}saveWeigh(val,d,false);toast('Weigh-in saved.');break}
  case 'del-weight':{const w=S.weights.find(w=>w.d===v);if(w&&w.p)phRemove(v);S.weights=S.weights.filter(w=>w.d!==v);save('weights');render();break}
  case 'photo':photoSheet(v);break;
  case 'photo-compare':compareSheet();break;
  case 'photo-del':{const w=S.weights.find(w=>w.d===v);if(w){delete w.p;save('weights')}phRemove(v);closeSheet();render();toast('Photo removed. The weigh-in is kept.');break}
  case 'plates':platesSheet();break;
  case 'rest-adj':if(rest){rest.end+=(+v)*1000;rest.total=Math.max(rest.total+(+v),1);tick()}break;
  case 'rest-skip':stopRest();break;
  default:if(typeof nutAction==='function')nutAction(a,v,b);
  }});
document.addEventListener('input',ev=>{const t=ev.target,i=t.dataset.i;if(typeof nutInput==='function'&&nutInput(t))return;if(!i)return;
  if(i==='set'){const st=S.active.exercises[+t.dataset.x].sets[+t.dataset.s],n=parseFloat(t.value);if(t.dataset.f==='w')st.w=isNaN(n)?null:Math.round(toKg(n)*100)/100;else st.r=isNaN(n)?null:Math.round(n);save('active')}
  else if(i==='wname'){S.active.name=t.value;save('active')}
  else if(i==='pickq'){pickQuery=t.value;const q=pickQuery.trim().toLowerCase();$('#pick-list').innerHTML=pickRows(allEx().filter(e=>(pickFilter==='All'||e.muscle===pickFilter)&&(!q||e.name.toLowerCase().includes(q))))}
  else if(i==='plates'){const v=parseFloat($('#pl-v').value)||0,b=parseFloat($('#pl-b').value)||0,id=t.id,pos=t.selectionStart;platesSheet(v,b);const el=$('#'+id);el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}});
document.addEventListener('change',ev=>{const t=ev.target;if(typeof nutChange==='function'&&nutChange(t))return;
  if(t.id==='bw-photo'){const f=t.files&&t.files[0],val=parseFloat($('#bw-val').value),d=$('#bw-date').value||ymd(Date.now());if(!f)return;if(!(val>0)){toast('Enter your weight first, then add the photo.');return}
    toast('Saving photo…');phSave(d,f).then(()=>{saveWeigh(val,d,true);toast('Weigh-in and photo saved.')}).catch(()=>{saveWeigh(val,d,false);toast('Weigh-in saved, but the photo could not be read.')});return}
  if(t.id!=='imp-json'&&t.id!=='imp-hevy')return;const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>t.id==='imp-json'?restore(String(r.result)):importHevy(String(r.result));r.onerror=()=>toast('Could not read that file.');r.readAsText(f)});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='lock-pin'){unlock();return}if(ev.key==='Escape'){dismissSheet();launcherClose()}else if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('div[role=button]')){ev.preventDefault();ev.target.click()}});

/* ================= boot ================= */
</script>

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(location.protocol==='https:')setTimeout(()=>checkUpdate(false),2500);
